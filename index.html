<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب فودافون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A;
  --ink-2:#3C424B;
  --ink-3:#767E8A;
  --line:#E3E6EB;
  --shell:#F2F3F5;
  --paper:#FFFFFF;
  --red:#E60000;
  --red-deep:#A30000;
  --red-soft:#FFECEC;
  --green:#0B7D5B;
  --green-soft:#E6F5EF;
  --amber:#B26A00;
  --amber-soft:#FFF3DF;
  --r:14px;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 8px 24px rgba(20,22,26,.06);
  --display:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--shell);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;display:inline-block;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3}

/* ---------- shell ---------- */
.topbar{
  background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;
  border-bottom:3px solid var(--red);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.2px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--red);position:relative;flex:0 0 auto}
.dot::after{content:"";position:absolute;inset:7px 5px 5px 7px;background:#fff;border-radius:50% 50% 50% 0;transform:rotate(-12deg)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:#A9B0BB;letter-spacing:.4px}
.topsearch{flex:1 1 260px;position:relative;min-width:200px}
.topsearch input{
  width:100%;padding:10px 38px 10px 12px;border-radius:10px;border:1px solid #2C3038;
  background:#1D2027;color:#fff;outline:none
}
.topsearch input::placeholder{color:#7C8492}
.topsearch input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,0,.25)}
.topsearch span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:#7C8492;font-size:14px}
.tabs{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:30}
.pill{
  border:1px solid #2C3038;background:#1D2027;color:#C6CCD6;border-radius:999px;padding:8px 13px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--body)
}
.pill:hover{border-color:#4A515C}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#6B7280;flex:0 0 auto}
.pill.ok::before{background:#22C55E}
.pill.warn::before{background:#F59E0B}
.pill.bad::before{background:var(--red)}
.pill.go::before{background:#38BDF8}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 42px 16px 0;border-inline-start:2px solid var(--line);margin-inline-start:13px}
.steps li:last-child{border-inline-start-color:transparent;padding-bottom:0}
.steps li::before{
  content:counter(s);position:absolute;inset-inline-start:-14px;top:0;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px
}
.steps li b{display:block;font-family:var(--display);margin-bottom:3px}
.steps li p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.tab{
  background:none;border:0;padding:13px 14px;font-weight:600;color:var(--ink-3);
  border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--display)
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 90px}
.banner{background:var(--amber-soft);border:1px solid #F0D9AE;color:#7A4B00;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}

/* ---------- generic ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700}
.card-b{padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 180px;min-width:150px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,0,.12)}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;
  font-family:var(--display);transition:.15s;white-space:nowrap
}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible{outline:3px solid rgba(230,0,0,.4);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#F3C9C9}
.btn.danger:hover{background:var(--red-soft)}
.muted{color:var(--ink-3)}
.tiny{font-size:12.5px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:6px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--ink-3)}
.kpi.red::before{background:var(--red)} .kpi.red b{color:var(--red)}
.kpi.green::before{background:var(--green)} .kpi.green b{color:var(--green)}
.kpi.amber::before{background:var(--amber)} .kpi.amber b{color:var(--amber)}

/* ---------- customer card ---------- */
.clist{display:grid;gap:12px}
.cust{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cust-h{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;flex:0 0 auto}
.cust-h .nm{flex:1;min-width:0}
.cust-h .nm b{font-family:var(--display);font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-h .nm span{font-size:12.5px;color:var(--ink-3)}
.owed{text-align:end;font-family:var(--display);font-weight:900;font-size:17px}
.owed small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--ink-3)}
.cust-b{border-top:1px dashed var(--line);padding:14px 15px;background:#FCFCFD;display:none}
.cust.open .cust-b{display:block}
.chev{color:var(--ink-3);transition:.2s;flex:0 0 auto}
.cust.open .chev{transform:rotate(180deg)}

/* SIM-card line tile = signature element */
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px}
.sim{
  position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px 11px;
  clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
}
.sim.on-time{border-color:#C9E7DB}
.sim.late{border-color:#F3C9C9}
.sim .chip{width:26px;height:20px;border-radius:4px;background:linear-gradient(#F1D08A,#D9AE55);position:relative;margin-bottom:9px}
.sim .chip::before,.sim .chip::after{content:"";position:absolute;inset-inline:3px;height:1px;background:rgba(0,0,0,.25)}
.sim .chip::before{top:7px}.sim .chip::after{top:13px}
.sim .no{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.4px}
.sim .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.sim .amt{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.sim .amt b{font-family:var(--display);font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.b-new{background:var(--red-soft);border-color:#F5C6C6;color:var(--red-deep)}
.b-tr{background:#EEF2FF;border-color:#D3DCFA;color:#2A3E9B}
.b-paid{background:var(--green-soft);border-color:#C9E7DB;color:var(--green)}
.b-part{background:var(--amber-soft);border-color:#F0D9AE;color:var(--amber)}
.b-un{background:var(--red-soft);border-color:#F5C6C6;color:var(--red-deep)}
.b-gray{background:var(--shell);border-color:var(--line);color:var(--ink-3)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:start;font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--ink-3);
  padding:10px 12px;border-bottom:1px solid var(--line);background:#FBFBFC;white-space:nowrap
}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FBFBFC}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.late-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;z-index:60;padding:16px;overflow:auto}
.overlay.on{display:block}
.modal{background:var(--paper);max-width:760px;margin:24px auto;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px}
.modal-b{padding:18px;max-height:70vh;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start;background:#FBFBFC}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}

.lrow{display:grid;grid-template-columns:1.3fr .9fr 1fr .9fr auto;gap:8px;align-items:end;margin-bottom:9px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#FBFBFC}
@media(max-width:720px){.lrow{grid-template-columns:1fr 1fr}}

/* ---------- toast ---------- */
#toast{position:fixed;inset-inline:0;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:90}
#toast div{
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(16px);opacity:0;transition:.25s
}
#toast div.on{transform:none;opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- invoice ---------- */
.inv{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;max-width:760px;margin:0 auto}
.inv-h{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.inv-h h2{font-size:22px;font-weight:900}
.inv-h .t{text-align:end;font-size:13px;color:var(--ink-3)}
.inv-to{background:var(--shell);border-radius:11px;padding:12px 14px;margin-bottom:16px}
.inv-to b{font-family:var(--display);font-size:18px}
.tot{margin-top:16px;margin-inline-start:auto;max-width:340px}
.tot div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.tot div.big{border-bottom:0;border-top:2px solid var(--ink);margin-top:6px;padding-top:11px;font-family:var(--display);font-weight:900;font-size:18px}
.stamp{margin-top:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;color:var(--ink-3);font-size:12.5px}
#printArea{display:none}
@media print{
  body{background:#fff}
  .topbar,.tabs,.noprint,#toast,.overlay{display:none!important}
  main{padding:0;max-width:none}
  .inv{border:0;padding:0;max-width:none}
  .card{border:0;box-shadow:none}
  th{background:#fff}
}
</style>
</head>

<script type="text/plain" id="gsCode">/** حساب فودافون — التطبيق + المزامنة جوّه حساب جوجل بتاعك */

/* بيفتح التطبيق نفسه لما تفتح رابط النشر */
function doGet(e){
  if(e && e.parameter && e.parameter.ping) return out_({ ok:true, ping:"hesab-vodafone", now:Date.now() });
  return HtmlService.createHtmlOutputFromFile("index")
    .setTitle("حساب فودافون")
    .addMetaTag("viewport", "width=device-width, initial-scale=1");
}

/* بينده من داخل التطبيق مباشرة — جوجل متأكد إنك انت صاحب الحساب */
function syncApi(req){
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try{
    var now = Date.now();
    var ch  = (req && req.changes) || {};
    var who = "";
    try{ who = Session.getActiveUser().getEmail(); }catch(e){}
    return {
      ok:true, now:now, user:who,
      customers: sync_("customers", CUST_COLS, ch.customers||[], Number(req.since)||0, now, custToRow_, rowToCust_),
      tx:        sync_("tx",        TX_COLS,   ch.tx||[],        Number(req.since)||0, now, txToRow_,   rowToTx_)
    };
  } finally { lock.releaseLock(); }
}

/* للطريقة التانية: التطبيق مرفوع بره وبيكلّم السكريبت بالرابط */
var SECRET = "ghayyar-el-kelma-di-123";

var CUST_COLS = ["id","name","note","numbers","lines_json","updatedAt","serverAt","deleted"];
var TX_COLS   = ["id","date","customerName","lineNumber","kind","amount","period","note","branch","customerId","lineId","updatedAt","serverAt","deleted"];

function doPost(e){
  try{
    var req = JSON.parse(e.postData.contents);
    if(String(req.key||"") !== SECRET) return out_({ ok:false, error:"مفتاح المزامنة غلط" });
    return out_(syncApi(req));
  }catch(err){ return out_({ ok:false, error:String(err) }); }
}

function out_(o){
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function sheet_(name, cols){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(name);
  if(!sh){
    sh = ss.insertSheet(name);
    sh.getRange(1,1,sh.getMaxRows(),cols.length).setNumberFormat("@");
    sh.getRange(1,1,1,cols.length).setValues([cols]).setFontWeight("bold");
    sh.setFrozenRows(1);
  }
  return sh;
}

function sync_(name, cols, incoming, since, now, toRow, toRec){
  var sh   = sheet_(name, cols);
  var last = sh.getLastRow();
  var vals = last > 1 ? sh.getRange(2,1,last-1,cols.length).getValues() : [];
  var uAt  = cols.indexOf("updatedAt");
  var sAt  = cols.indexOf("serverAt");
  var idx  = {};
  for(var i=0;i<vals.length;i++){ var id = String(vals[i][0]); if(id) idx[id] = i; }

  for(var k=0;k<incoming.length;k++){
    var rec = incoming[k];
    if(!rec || !rec.id) continue;
    var rid = String(rec.id);
    if(idx.hasOwnProperty(rid)){
      var cur = Number(vals[idx[rid]][uAt]) || 0;
      if((Number(rec.updatedAt)||0) >= cur) vals[idx[rid]] = toRow(rec, now);   // الأحدث يكسب
    }else{
      idx[rid] = vals.length;
      vals.push(toRow(rec, now));
    }
  }

  if(vals.length){
    var need = vals.length + 1 - sh.getMaxRows();
    if(need > 0) sh.insertRowsAfter(sh.getMaxRows(), need + 50);
    sh.getRange(2,1,vals.length,cols.length).setValues(vals);
  }

  var res = [];
  for(var j=0;j<vals.length;j++){
    if((Number(vals[j][sAt])||0) > since) res.push(toRec(vals[j]));
  }
  return res;
}

function custToRow_(r, now){
  var lines = r.lines || [];
  var nums  = [];
  for(var i=0;i<lines.length;i++) nums.push(lines[i].number);
  return [ String(r.id), String(r.name||""), String(r.note||""), nums.join(" | "),
           JSON.stringify(lines), Number(r.updatedAt)||now, now, r.deleted?"1":"" ];
}
function rowToCust_(row){
  var lines = [];
  try{ lines = JSON.parse(row[4] || "[]"); }catch(e){}
  return { id:String(row[0]), name:String(row[1]), note:String(row[2]), lines:lines,
           updatedAt:Number(row[5])||0, deleted: String(row[7])==="1" };
}
function txToRow_(r, now){
  return [ String(r.id), d_(r.date), String(r.customerName||""), String(r.lineNumber||""),
           String(r.kind||""), Number(r.amount)||0, String(r.period||""), String(r.note||""),
           String(r.branch||""), String(r.customerId||""), String(r.lineId||""),
           Number(r.updatedAt)||now, now, r.deleted?"1":"" ];
}
function rowToTx_(row){
  return { id:String(row[0]), date:d_(row[1]), kind:String(row[4]), amount:Number(row[5])||0,
           period:String(row[6]), note:String(row[7]), branch:String(row[8]),
           customerId:String(row[9]), lineId:String(row[10]),
           updatedAt:Number(row[11])||0, deleted: String(row[13])==="1" };
}
function d_(v){
  if(v instanceof Date) return Utilities.formatDate(v, "GMT+2", "yyyy-MM-dd");
  return String(v||"").slice(0,10);
}
</script>

<script>
"use strict";
/* ============================================================
   حساب فودافون — تطبيق واحد بملف واحد
   البيانات: عملاء ← خطوط ← حركات (فاتورة / دفعة)
   ============================================================ */

const KEY = "hesab_vodafone_v1";
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

let DB = {
  customers: [],
  tx: [],
  graves: [],                       // سجلات محذوفة لازم تتبلّغ للفروع التانية
  dirty: { c:{}, x:{} },            // اللي اتغيّر ولسه مارفعش
  settings: { reportDay: 8, generateOnDueDate: false, shopName: "حساب فودافون", currency: "ج.م" },
  sync: { url:"", key:"", branch:"", device:"", lastSync:0, lastOkAt:0, lastErr:"" },
  meta: { created: new Date().toISOString() }
};
let UI = { tab:"customers", q:"", reportMonth:monthKey(new Date()), filter:"all", open:{}, invCustomer:"", invMonth:monthKey(new Date()) };
let CAN_SAVE = true;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const digits = s => String(s??"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function monthKey(d){ d = new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(mk){ const [y,m]=mk.split("-"); return AR_MONTHS[Number(m)-1]+" "+y; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dueDateOf(mk, day){ const [y,m]=mk.split("-").map(Number); const d=Math.min(day||1, daysInMonth(y,m)); return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function monthsFrom(startMk, endMk){
  const out=[]; let [y,m]=startMk.split("-").map(Number); const [ey,em]=endMk.split("-").map(Number);
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard++<400){ out.push(y+"-"+String(m).padStart(2,"0")); m++; if(m>12){m=1;y++;} }
  return out;
}
function toast(msg){
  const box=$("#toast"); box.innerHTML="";
  const d=document.createElement("div"); d.textContent=msg; box.appendChild(d);
  requestAnimationFrame(()=>d.classList.add("on"));
  setTimeout(()=>{ d.classList.remove("on"); setTimeout(()=>d.remove(),300); },2600);
}
function parseDateLoose(v){
  if(!v) return "";
  v = digits(String(v).trim());
  let m;
  if((m = v.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m = v.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/))) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if((m = v.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2})$/))) return `20${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const d = new Date(v); return isNaN(d) ? "" : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseNum(v){ const n = parseFloat(digits(String(v??"")).replace(/[^\d.\-]/g,"")); return isNaN(n)?0:n; }

/* ---------- storage ---------- */
const LOCAL = (()=>{ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }catch(e){ return null; } })();
function applyLoaded(d){
  DB.customers = d.customers||[];
  DB.tx        = d.tx||[];
  DB.graves    = d.graves||[];
  DB.dirty     = d.dirty||{c:{},x:{}};
  DB.settings  = Object.assign(DB.settings, d.settings||{});
  DB.sync      = Object.assign(DB.sync, d.sync||{});
}
async function load(){
  let got=false;
  if(window.storage){
    try{ const r = await window.storage.get(KEY); if(r&&r.value){ applyLoaded(JSON.parse(r.value)); got=true; } }catch(e){}
  }
  if(!got && LOCAL){
    try{ const v = LOCAL.getItem(KEY); if(v){ applyLoaded(JSON.parse(v)); got=true; } }catch(e){}
  }
  CAN_SAVE = !!(window.storage || LOCAL);
  if(!DB.sync.device) DB.sync.device = uid();
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    const s = JSON.stringify(DB); let ok=false;
    if(window.storage){ try{ const p=window.storage.set(KEY,s); if(p&&p.catch) p.catch(()=>{}); ok=true; }catch(e){} }
    if(LOCAL){ try{ LOCAL.setItem(KEY,s); ok=true; }catch(e){} }
    CAN_SAVE = ok;
    if(!ok) $("#storeWarn").style.display="block";
  },250);
  scheduleSync();
}
/* وسم السجل كـ«اتغيّر» عشان يترفع في المزامنة الجاية */
function touchC(c){ c.updatedAt = Date.now(); DB.dirty.c[c.id]=1; }
function touchX(t){ t.updatedAt = Date.now(); if(!t.branch) t.branch = DB.sync.branch||""; DB.dirty.x[t.id]=1; }
function bury(type, id){ DB.graves.push({t:type, id, updatedAt:Date.now()}); if(type==="c") delete DB.dirty.c[id]; else delete DB.dirty.x[id]; }

/* ---------- data model ---------- */
function customerById(id){ return DB.customers.find(c=>c.id===id); }
function allLines(){ const out=[]; DB.customers.forEach(c=>c.lines.forEach(l=>out.push({c,l}))); return out; }
function findLine(lineId){ for(const c of DB.customers){ const l=c.lines.find(x=>x.id===lineId); if(l) return {c,l}; } return null; }

/* توليد الفواتير الشهرية تلقائيًا لكل خط من تاريخ استحقاقه حتى الشهر الحالي */
function ensureInvoices(){
  const nowMk = monthKey(new Date());
  const today = todayISO();
  let added = 0;
  const have = new Set(DB.tx.filter(t=>t.kind==="invoice").map(t=>t.lineId+"|"+t.period));
  DB.customers.forEach(c=>{
    c.lines.forEach(l=>{
      if(l.stopped) return;
      const start = l.startDate ? monthKey(l.startDate) : nowMk;
      if(start > nowMk) return;
      const day = l.startDate ? Number(String(l.startDate).slice(8,10)) : 1;
      monthsFrom(start, nowMk).forEach(mk=>{
        const key = l.id+"|"+mk;
        if(have.has(key)) return;
        const due = dueDateOf(mk, day);
        // الشهر الأول يبدأ من تاريخ العرض؛ والشهر الحالي: إمّا أول الشهر أو يوم الاستحقاق حسب الإعداد
        if(mk===nowMk && DB.settings.generateOnDueDate && due>today) return;
        const iid = "inv_"+l.id+"_"+mk;                       // رقم ثابت: نفس الفاتورة في كل الفروع
        if(DB.graves.some(g=>g.id===iid)) { have.add(key); return; }
        const t = { id:iid, kind:"invoice", customerId:c.id, lineId:l.id, amount:Number(l.monthly)||0, date:due, period:mk, note:"فاتورة شهر "+monthLabel(mk) };
        touchX(t); DB.tx.push(t);
        have.add(key); added++;
      });
    });
  });
  if(added){ save(); }
  return added;
}

function txOfLine(id){ return DB.tx.filter(t=>t.lineId===id); }
function lineBalance(id){
  let b=0; for(const t of DB.tx){ if(t.lineId!==id) continue; b += (t.kind==="payment" ? -t.amount : t.amount); }
  return Math.round(b*100)/100;
}
function customerBalance(cid){
  let b=0; for(const t of DB.tx){ if(t.customerId!==cid) continue; b += (t.kind==="payment" ? -t.amount : t.amount); }
  return Math.round(b*100)/100;
}
function dueInPeriod(cid, mk, lineId){
  return DB.tx.filter(t=>t.kind!=="payment" && t.customerId===cid && t.period===mk && (!lineId||t.lineId===lineId))
              .reduce((s,t)=>s+t.amount,0);
}
function paidInPeriod(cid, mk, lineId){
  return DB.tx.filter(t=>t.kind==="payment" && t.customerId===cid && String(t.date).slice(0,7)===mk && (!lineId||t.lineId===lineId))
              .reduce((s,t)=>s+t.amount,0);
}
function statusOf(due, paid){
  if(due<=0 && paid<=0) return {k:"none", txt:"لا يوجد مستحق", cls:"b-gray"};
  if(paid<=0) return {k:"unpaid", txt:"لم يدفع", cls:"b-un"};
  if(paid+0.009 >= due) return {k:"paid", txt:"دفع", cls:"b-paid"};
  return {k:"partial", txt:"دفع جزئي", cls:"b-part"};
}
function isLateNow(mk){
  const now = new Date(); const cur = monthKey(now);
  if(mk < cur) return true;
  if(mk > cur) return false;
  return now.getDate() >= (Number(DB.settings.reportDay)||8);
}
/* دفعة على مستوى العميل: تُخصم من أقدم مديونية أولًا */
function payCustomer(cid, amount, date, note){
  const c = customerById(cid); if(!c) return 0;
  let left = Number(amount)||0;
  const ordered = c.lines.slice().sort((a,b)=>String(a.startDate||"").localeCompare(String(b.startDate||"")));
  for(const l of ordered){
    if(left<=0.009) break;
    const bal = lineBalance(l.id);
    if(bal<=0.009) continue;
    const pay = Math.min(bal,left);
    const t = {id:uid(),kind:"payment",customerId:cid,lineId:l.id,amount:pay,date,period:String(date).slice(0,7),note:note||"دفعة"};
    touchX(t); DB.tx.push(t);
    left -= pay;
  }
  if(left>0.009 && ordered.length){ // دفع مقدم / زيادة
    const l = ordered[0];
    const t = {id:uid(),kind:"payment",customerId:cid,lineId:l.id,amount:left,date,period:String(date).slice(0,7),note:(note?note+" — ":"")+"دفع مقدّم"};
    touchX(t); DB.tx.push(t);
  }
  save(); return amount;
}

/* ---------- search ---------- */
/* يقبل: اسم فقط / رقم فقط / الاثنين معًا (الاسم + الرقم = بحث مزدوج) */
function searchCustomers(q){
  q = digits(String(q||"").trim());
  if(!q) return DB.customers.slice();
  const tokens = q.split(/\s+/).filter(Boolean);
  const numTok = tokens.filter(t=>/^\d{3,}$/.test(t));
  const txtTok = tokens.filter(t=>!/^\d{3,}$/.test(t));
  return DB.customers.filter(c=>{
    const nameOk = txtTok.length===0 || txtTok.every(t=>c.name.includes(t) || (c.note||"").includes(t));
    const numOk  = numTok.length===0 || numTok.every(t=>c.lines.some(l=>digits(l.number||"").includes(t)));
    return nameOk && numOk;
  });
}
function matchedLines(c,q){
  const numTok = digits(String(q||"")).split(/\s+/).filter(t=>/^\d{3,}$/.test(t));
  if(!numTok.length) return null;
  return c.lines.filter(l=>numTok.some(t=>digits(l.number||"").includes(t)));
}

}

/* ---------- 3) التقارير ---------- */
function viewReports(){
  const mk = UI.reportMonth;
  const rows = DB.customers.map(c=>{
    const d = dueInPeriod(c.id,mk), p = paidInPeriod(c.id,mk), b = customerBalance(c.id);
    const st = statusOf(d,p);
    return {c,d,p,rest:Math.max(0,d-p),b,st};
  }).filter(r=>r.d>0 || r.p>0 || r.b>0.009);

  const f = UI.filter;
  const shown = rows.filter(r=> f==="all" ? true : f==="paid" ? r.st.k==="paid" : f==="unpaid" ? r.st.k==="unpaid" : f==="partial" ? r.st.k==="partial" : r.b>0.009 );
  const T = rows.reduce((a,r)=>({d:a.d+r.d,p:a.p+r.p,rest:a.rest+r.rest,b:a.b+Math.max(0,r.b)}),{d:0,p:0,rest:0,b:0});
  const late = isLateNow(mk);

  const months = (()=>{
    const s = new Set(DB.tx.map(t=>t.period).filter(Boolean)); s.add(monthKey(new Date()));
    return [...s].sort().reverse();
  })();

  let html = `

}
function branchCard(mk, totalPaid){
  const by = {};
  DB.tx.filter(t=>t.kind==="payment" && String(t.date).slice(0,7)===mk)
       .forEach(t=>{ const b=t.branch||"غير محدد"; by[b]=(by[b]||0)+t.amount; });
  const names = Object.keys(by);
  if(names.length<2) return "";
  return `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>التحصيل حسب الجهاز — ${monthLabel(mk)}</h3></div>
    <div class="card-b" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>الجهاز</th><th class="n">المحصّل</th><th class="n">النسبة</th></tr></thead><tbody>
    ${names.sort((a,b)=>by[b]-by[a]).map(b=>`<tr><td><b>${esc(b)}</b></td>
      <td class="n num" style="color:var(--green);font-weight:700">${money(by[b])}</td>
      <td class="n num">${totalPaid?Math.round(by[b]/totalPaid*100):0}%</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
}
function lineLookupHtml(q){
  const qq = digits(q).replace(/\D/g,"");
  if(!qq) return `<div class="tiny muted">اكتب رقم أو آخر ٤ أرقام.</div>`;
  const hits = allLines().filter(x=>digits(x.l.number||"").replace(/\D/g,"").includes(qq));
  if(!hits.length) return `<div class="empty"><b>مفيش رقم مطابق</b>جرّب آخر ٤ أرقام بس.</div>`;
  return hits.map(({c,l})=>{
    const b = lineBalance(l.id);
    const tx = txOfLine(l.id).sort((a,z)=>String(z.date).localeCompare(String(a.date))).slice(0,14);
    return `<div class="card" style="margin-bottom:12px;box-shadow:none">
      <div class="card-h"><h3>${esc(l.number)} — ${esc(c.name)}</h3>
      <span class="badge ${b>0.009?"b-un":"b-paid"}">${b>0.009?"مديونية "+money(b):"خالص"} ${esc(DB.settings.currency)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">فاتورة</th><th class="n">دفع</th></tr></thead><tbody>
      ${tx.map(t=>`<tr><td class="num">${fmtDate(t.date)}</td><td class="tiny">${esc(t.note||"")}</td>
        <td class="n num">${t.kind!=="payment"?money(t.amount):"—"}</td>
        <td class="n num" style="color:var(--green)">${t.kind==="payment"?money(t.amount):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
}

function viewInvoice(){
  const months = (()=>{ const s=new Set(DB.tx.map(t=>t.period).filter(Boolean)); s.add(monthKey(new Date())); return [...s].sort().reverse(); })();
  const cid = UI.invCustomer || (DB.customers[0]&&DB.customers[0].id) || "";
  let html = `<div class="card noprint" style="margin-bottom:16px"><div class="card-b"><div class="row">
    <div class="grow"><label>العميل</label><select id="invCust">${DB.customers.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.name)}</option>`).join("")||`<option>لا يوجد عملاء</option>`}</select></div>
    <div class="grow"><label>الشهر</label><select id="invMonth">${months.map(m=>`<option value="${m}" ${m===UI.invMonth?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
    <div><button class="btn primary" data-act="printInvoice">طباعة</button></div>
    <div><button class="btn" data-act="saveInvoice">حفظ كملف</button></div>
  </div></div></div>`;
  if(!cid) return html + `<div class="card"><div class="empty"><b>اختر عميلًا أولًا</b>أضف عميل من تبويب «العملاء والخطوط».</div></div>`;
  return html + invoiceHtml(cid, UI.invMonth);
}
function invoiceHtml(cid, mk){
  const c = customerById(cid); if(!c) return "";
  const day = Number(DB.settings.reportDay)||8;
  const rows = c.lines.map(l=>{
    const inv = DB.tx.filter(t=>t.kind!=="payment" && t.lineId===l.id && t.period===mk).reduce((s,t)=>s+t.amount,0);
    const pay = DB.tx.filter(t=>t.kind==="payment" && t.lineId===l.id && String(t.date).slice(0,7)===mk).reduce((s,t)=>s+t.amount,0);
    return {l,inv,pay,bal:lineBalance(l.id)};
  });
  const monthDue = rows.reduce((s,r)=>s+r.inv,0);
  const monthPaid = rows.reduce((s,r)=>s+r.pay,0);
  const totalBal = customerBalance(cid);
  const prev = totalBal - monthDue + monthPaid;
  return `<div class="inv" id="invBox">
    <div class="inv-h">
      <div><h2>${esc(DB.settings.shopName||"حساب فودافون")}</h2><div class="tiny muted">فاتورة خدمات خطوط شهرية</div></div>
      <div class="t">فاتورة شهر<br><b style="font-family:var(--display);font-size:18px;color:var(--ink)">${monthLabel(mk)}</b>
      <br>تاريخ الإصدار: <span class="num">${fmtDate(dueDateOf(mk,day))}</span></div>
    </div>
    <div class="inv-to"><div class="tiny muted">العميل</div><b>${esc(c.name)}</b>
      <div class="tiny muted"><span class="num">${c.lines.length}</span> خط · ${c.note?esc(c.note):"—"}</div></div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>#</th><th>رقم الخط</th><th>النوع</th><th>تاريخ الاستحقاق</th><th class="n">فاتورة الشهر</th><th class="n">المدفوع</th><th class="n">رصيد الخط</th>
    </tr></thead><tbody>
    ${rows.map((r,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td class="num"><b>${esc(r.l.number)}</b></td>
      <td><span class="badge ${r.l.type==="تحويل"?"b-tr":"b-new"}">${esc(r.l.type||"جديد")}</span></td>
      <td class="num">${fmtDate(dueDateOf(mk, Number(String(r.l.startDate||"").slice(8,10))||day))}</td>
      <td class="n num">${money(r.inv)}</td>
      <td class="n num">${money(r.pay)}</td>
      <td class="n num" style="font-weight:700;color:${r.bal>0.009?"var(--red)":"var(--green)"}">${money(r.bal)}</td>
    </tr>`).join("")}
    </tbody></table></div>
    <div class="tot">
      <div><span>رصيد سابق</span><b class="num">${money(prev)}</b></div>
      <div><span>فواتير ${monthLabel(mk)}</span><b class="num">${money(monthDue)}</b></div>
      <div><span>المدفوع خلال الشهر</span><b class="num" style="color:var(--green)">− ${money(monthPaid)}</b></div>
      <div class="big"><span>${totalBal>0.009?"المطلوب سداده":"الرصيد"}</span><b class="num" style="color:${totalBal>0.009?"var(--red)":"var(--green)"}">${money(Math.abs(totalBal))} ${esc(DB.settings.currency)}</b></div>
    </div>
    <div class="stamp">
      <div>السداد قبل يوم <span class="num">${day}</span> من كل شهر.<br>شكرًا لتعاملكم معنا.</div>
      <div style="text-align:end">التوقيع / الختم<br><br>ــــــــــــــــــ</div>
    </div>
  </div>`;
}

function payModal(opt){

  if(!c) return;
  const l = lineId ? (findLine(lineId)||{}).l : null;
  const suggested = l ? Math.max(0, lineBalance(l.id)) : Math.max(0, customerBalance(c.id));
  openModal(`
    <div class="modal-h"><h3>تحصيل من ${esc(c.name)}</h3><button class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <input type="hidden" id="pcid" value="${c.id}"><input type="hidden" id="plid" value="${l?l.id:""}">
      <div class="tiny muted" style="margin-bottom:12px">
        ${l?`الخط <b class="num">${esc(l.number)}</b> — المستحق عليه <b class="num">${money(lineBalance(l.id))}</b>`

function ledgerModal(lineId){
  const f = findLine(lineId); if(!f) return;
  const {c,l} = f;
  const tx = txOfLine(l.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  let run = lineBalance(l.id);
  const rows = tx.map(t=>{
    const cur = run;
    run -= (t.kind==="payment" ? -t.amount : t.amount);
    return `<tr><td class="num">${fmtDate(t.date)}</td><td class="tiny">${esc(t.note||"")}</td>
      <td class="n num">${t.kind!=="payment"?money(t.amount):"—"}</td>
      <td class="n num" style="color:var(--green)">${t.kind==="payment"?money(t.amount):"—"}</td>
      <td class="n num" style="font-weight:700">${money(cur)}</td>
      <td><button class="btn sm danger" data-act="delTx" data-tx="${t.id}">حذف</button></td></tr>`;
  }).join("");
  openModal(`
    <div class="modal-h"><h3>كشف حساب ${esc(l.number)} — ${esc(c.name)}</h3><button class="x" data-act="close">×</button></div>
    <div class="modal-b" style="padding:0">
      <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">فاتورة</th><th class="n">دفع</th><th class="n">الرصيد</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="6" class="empty">لا توجد حركات.</td></tr>`}</tbody></table></div>
    </div>
    <div class="modal-f"><button class="btn primary" data-act="payLine" data-line="${l.id}">تحصيل</button><button class="btn ghost" data-act="close">إغلاق</button></div>`);
}
function detailModal(cid){
  const c = customerById(cid); if(!c) return;
  const mk = UI.reportMonth;
  const rows = c.lines.map(l=>{
    const d = dueInPeriod(c.id,mk,l.id), p = paidInPeriod(c.id,mk,l.id), b = lineBalance(l.id), st = statusOf(d,p);
    return `<tr><td class="num"><b>${esc(l.number)}</b></td>
      <td><span class="badge ${l.type==="تحويل"?"b-tr":"b-new"}">${esc(l.type)}</span></td>

      <td class="n num" style="font-weight:700;color:${b>0.009?"var(--red)":"var(--ink-3)"}">${money(b)}</td>

    <div class="modal-b" style="padding:0"><div class="tbl-wrap"><table><thead><tr>

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act = t.dataset.act;

  if(act==="close"){ closeModal(); return; }
  if(act==="new"){ customerModal(); return; }
  if(act==="goto"){ UI.tab=t.dataset.tab; render(); return; }
  if(act==="toggle"){ const id=t.dataset.id; UI.open[id]=!UI.open[id]; render(); return; }
  if(act==="expandAll"){ DB.customers.forEach(c=>UI.open[c.id]=true); render(); return; }
  if(act==="collapseAll"){ UI.open={}; render(); return; }
  if(act==="edit"){ customerModal(t.dataset.id); return; }
  if(act==="addLine"){
    const box=$("#lines");
    if(box.children.length>=5){ toast("الحد الأقصى ٥ خطوط للعميل"); return; }
    box.insertAdjacentHTML("beforeend", lineRow(null, box.children.length)); return;
  }
  if(act==="rmLine"){
    const box=$("#lines");
    if(box.children.length<=1){ toast("لازم خط واحد على الأقل"); return; }
    t.closest(".lrow").remove(); return;
  }
  if(act==="saveCust"){ saveCustomer(); return; }
  if(act==="del"){
    const c=customerById(t.dataset.id); if(!c) return;
    if(!confirm(`حذف ${c.name} وكل خطوطه وحركاته؟`)) return;
    bury("c", c.id);
    DB.tx.filter(x=>x.customerId===c.id).forEach(x=>bury("x",x.id));
    DB.customers = DB.customers.filter(x=>x.id!==c.id);
    DB.tx = DB.tx.filter(x=>x.customerId!==c.id);
    save(); render(); toast("تم الحذف");
    return;
  }
  if(act==="payLine"){ payModal({lineId:t.dataset.line, cid:(findLine(t.dataset.line)||{}).c?.id}); return; }
  if(act==="payCust"){ payModal({cid:t.dataset.id}); return; }
  if(act==="doPay"){ doPay(); return; }
  if(act==="ledger"){ ledgerModal(t.dataset.line); return; }
  if(act==="detail"){ detailModal(t.dataset.id); return; }
  if(act==="delTx"){
    if(!confirm("حذف الحركة دي؟")) return;
    bury("x", t.dataset.tx);
    DB.tx = DB.tx.filter(x=>x.id!==t.dataset.tx);
    save(); closeModal(); render(); toast("اتحذفت");
    return;
  }
  if(act==="invoice"){ UI.invCustomer=t.dataset.id; UI.invMonth=monthKey(new Date()); UI.tab="invoice"; render(); return; }
  if(act==="printInvoice"){ printHtml($("#invBox")?$("#invBox").outerHTML:""); return; }
  if(act==="saveInvoice"){
    const c=customerById(UI.invCustomer);
    downloadFile(`فاتورة-${(c?c.name:"عميل").replace(/\s+/g,"_")}-${UI.invMonth}.html`, standaloneDoc($("#invBox").outerHTML), "text/html");
    return;
  }
  if(act==="printReport"){ window.print(); return; }
  if(act==="csvReport"){ exportReportCsv(); return; }
  if(act==="lineLookup"){ UI.lineQ=$("#lineQ").value; $("#lineResult").innerHTML=lineLookupHtml(UI.lineQ); return; }
  if(act==="doImport"){ doImport(); return; }
  if(act==="template"){
    downloadFile("نموذج-بيانات-فودافون.csv","\uFEFF"+["اسم العميل,رقم الخط,نوع الخط,تاريخ الاستحقاق,قيمة الفاتورة",
      "أحمد محمد,01001234567,جديد,08/01/2026,250","أحمد محمد,01007654321,تحويل,08/01/2026,180","منى علي,01112223334,جديد,15/02/2026,300"].join("\n"),"text/csv");
    return;
  }
  if(act==="saveSync"){
    if($("#syUrl")) DB.sync.url = $("#syUrl").value.trim();
    if($("#syKey")) DB.sync.key = $("#syKey").value.trim();
    if($("#syBranch")) DB.sync.branch = $("#syBranch").value.trim();
    if(!DB.sync.device) DB.sync.device = uid();
    DB.sync.lastErr = "";
    persistNow(); render(); refreshPill();
    toast("اتحفظت");
    if(syncOn()) syncNow(false);
    return;
  }
  if(act==="syncNow"){ syncNow(false); return; }
  if(act==="testSync"){ testSync(); return; }
  if(act==="guide"){ guideModal(); return; }
  if(act==="copyGs"){
    const ta=$("#gsBox"); if(!ta) return;
    ta.focus(); ta.select();
    const code = document.getElementById("gsCode").textContent;
    const done=()=>toast("الكود اتنسخ — الزقه في Apps Script");
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done).catch(()=>{ try{document.execCommand("copy");done();}catch(e){toast("النص محدَّد — انسخه يدوي");} });
    else { try{ document.execCommand("copy"); done(); }catch(e){ toast("النص محدَّد — انسخه يدوي"); } }
    return;
  }
  if(act==="backup"){
    if(!DB.customers.length){ toast("مفيش بيانات تتنسخ"); return; }
    downloadFile(`نسخة-حساب-فودافون-${todayISO()}.json`, JSON.stringify(DB,null,2), "application/json");
    return;
  }
  if(act==="copyBackup"){ showBackupText(); return; }
  if(act==="copyText"){
    const ta=$("#bkText"); if(!ta) return;
    ta.focus(); ta.select();
    const done=()=>{ toast("اتنسخت — الزقها في مكان آمن"); closeModal(); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(backupText()).then(done).catch(()=>{ try{ document.execCommand("copy"); done(); }catch(e){ toast("اعمل نسخ يدوي: النص محدَّد بالفعل"); } });
    }else{ try{ document.execCommand("copy"); done(); }catch(e){ toast("اعمل نسخ يدوي: النص محدَّد بالفعل"); } }
    return;
  }
  if(act==="restore"){ restore(); return; }
  if(act==="restorePaste"){
    const v=$("#restoreText").value;
    if(!v.trim()){ toast("الزق النص الأول"); return; }
    if(DB.customers.length && !confirm("الاستعادة هتستبدل البيانات الحالية. تمام؟")) return;
    restoreFromText(v,"لصق");
    return;
  }
  if(act==="csvCustomers"){ exportCustomersCsv(); return; }
  if(act==="csvTx"){ exportTxCsv(); return; }
  if(act==="saveSettings"){
    DB.settings.shopName=$("#setShop").value.trim()||"حساب فودافون";
    DB.settings.currency=$("#setCur").value.trim()||"ج.م";
    DB.settings.reportDay=Math.min(28,Math.max(1,parseNum($("#setDay").value)||8));
    DB.settings.generateOnDueDate = $("#setGen").value==="1";
    save(); render(); toast("اتحفظت الإعدادات");
    return;
  }
  if(act==="wipe"){
    if(!confirm("مسح كل البيانات نهائيًا؟")) return;
    if(!confirm("متأكد؟ خُد نسخة احتياطية الأول.")) return;
    DB.customers=[]; DB.tx=[]; save(); render(); toast("تم المسح");
    return;
  }
});

/* ---------- actions ---------- */
function saveCustomer(){
  const id = $("#cid").value;
  const name = $("#cname").value.trim();
  if(!name){ toast("اكتب اسم العميل"); $("#cname").focus(); return; }
  const rows = [...document.querySelectorAll(".lrow")].map(r=>({
    id: r.dataset.lrow,
    number: digits(r.querySelector(".f-num").value.trim()),
    type: r.querySelector(".f-type").value,
    startDate: r.querySelector(".f-date").value || todayISO(),
    monthly: parseNum(r.querySelector(".f-amt").value)
  })).filter(r=>r.number || r.monthly);
  if(!rows.length){ toast("أضف خط واحد على الأقل برقمه وقيمة فاتورته"); return; }
  if(rows.length>5){ toast("الحد الأقصى ٥ خطوط"); return; }

  if(id){
    const c = customerById(id);
    c.name=name; c.note=$("#cnote").value.trim();
    const keep = new Set(rows.map(r=>r.id));
    c.lines.filter(l=>!keep.has(l.id)).forEach(l=>{
      DB.tx.filter(t=>t.lineId===l.id).forEach(t=>bury("x",t.id));
      DB.tx = DB.tx.filter(t=>t.lineId!==l.id);
    });
    c.lines = rows.map(r=>{ const old=c.lines.find(l=>l.id===r.id); return Object.assign({},old||{},r); });
    touchC(c);
  }else{
    const c = { id:uid(), name, note:$("#cnote").value.trim(), lines:rows, created:todayISO() };
    touchC(c); DB.customers.push(c);
  }
  const n = ensureInvoices();
  save(); closeModal(); render();
  toast(id ? "اتحفظ التعديل" : `اتضاف العميل${n?` وتولّدت ${n} فاتورة`:""}`);
}
function doPay(){
  const cid=$("#pcid").value, lid=$("#plid").value;
  const amt=parseNum($("#pamt").value), date=$("#pdate").value||todayISO(), note=$("#pnote").value.trim();
  if(amt<=0){ toast("اكتب مبلغ صحيح"); return; }
  if(lid){
    const t = {id:uid(),kind:"payment",customerId:cid,lineId:lid,amount:amt,date,period:String(date).slice(0,7),note:note||"دفعة"};
    touchX(t); DB.tx.push(t);
    save();
  }else{
    payCustomer(cid, amt, date, note);
  }
  closeModal(); render(); toast(`اتسجل دفع ${money(amt)} ${DB.settings.currency}`);
}
function doImport(){
  const raw = $("#imp").value.trim();
  if(!raw){ toast("الصق البيانات الأول"); return; }
  importSheet(raw);
}
function importSheet(raw){
  const lines = String(raw).replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  let added=0, newCust=0, skipped=0;
  lines.forEach((ln,idx)=>{
    const sep = ln.includes("\t") ? "\t" : (ln.split(",").length>=3 ? "," : ";");
    const p = ln.split(sep).map(s=>s.trim().replace(/^"|"$/g,""));
    if(idx===0 && /اسم|name/i.test(p[0]||"")) return;
    const [name,num,type,date,amt] = p;
    if(!name || !num){ skipped++; return; }
    let c = DB.customers.find(x=>x.name.trim()===name.trim());
    if(!c){ c={id:uid(),name:name.trim(),note:"",lines:[],created:todayISO()}; DB.customers.push(c); newCust++; }
    if(c.lines.length>=5){ skipped++; return; }
    const numClean = digits(num).replace(/\s/g,"");
    if(c.lines.some(l=>l.number===numClean)){ skipped++; return; }
    c.lines.push({ id:uid(), number:numClean,
      type: /تحويل|transfer/i.test(type||"") ? "تحويل":"جديد",
      startDate: parseDateLoose(date) || todayISO(),
      monthly: parseNum(amt) });
    touchC(c); added++;
  });
  const inv = ensureInvoices();
  save(); UI.tab="customers"; render();
  toast(`تم: ${newCust} عميل جديد · ${added} خط · ${inv} فاتورة${skipped?` · ${skipped} سطر متخطّى`:""}`);
}
function restore(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,.csv,.txt,application/json,text/csv,text/plain";
  inp.style.cssText="position:fixed;inset-inline-start:-9999px;opacity:0";
  document.body.appendChild(inp);           // لازم يكون في الصفحة عشان يشتغل على الموبايل
  inp.addEventListener("change", ()=>{
    const f = inp.files && inp.files[0];
    if(!f){ toast("مااتحددش ملف"); inp.remove(); return; }
    if(f.size===0){ toast("الملف فاضي (٠ بايت) — التنزيل ما اكتملش. استخدم «نسخ النسخة كنص»"); inp.remove(); return; }
    const r=new FileReader();
    r.onerror = ()=>{ toast("مقدرتش أقرأ الملف — جرّب «استعادة بلصق النص»"); inp.remove(); };
    r.onload  = ()=>{ restoreFromText(r.result, f.name); inp.remove(); };
    r.readAsText(f,"utf-8");
  });
  inp.click();
}
/* يقبل: JSON نسخة احتياطية / مصفوفة عملاء / ملف CSV / حتى نص متلزق فيه JSON */
function restoreFromText(text, srcName){
  let s = String(text||"").replace(/^\uFEFF/,"").trim();
  if(!s){ toast("محتوى الملف فاضي — استخدم «نسخ النسخة كنص»"); return false; }

  if(s[0]==="<"){                      // اتحفظ كصفحة HTML بدل ملف النسخة
    const m = s.match(/\{[\s\S]*"customers"[\s\S]*\}/);
    if(!m){ toast("دي صفحة ويب مش نسخة احتياطية — اختار ملف .json"); return false; }
    s = m[0];
  }
  if(s[0]!=="{" && s[0]!=="["){        // على الأرجح ملف CSV/Excel
    if(/[,\t;]/.test(s)){
      if(!confirm("الملف ده شيت مش نسخة احتياطية. أستورده كبيانات عملاء وخطوط؟")) return false;
      importSheet(s); return true;
    }
    toast("محتوى الملف مش نسخة صالحة — بيبدأ بـ: "+s.slice(0,30));
    return false;
  }

  let d;
  try{ d = JSON.parse(s); }
  catch(err){
    const m = s.match(/\{[\s\S]*\}/);
    try{ d = JSON.parse(m?m[0]:""); }
    catch(e2){ toast("الملف ناقص أو اتعدّل عليه — "+String(err.message).slice(0,50)); return false; }
  }
  if(Array.isArray(d)) d = {customers:d, tx:[]};
  if(!d || !Array.isArray(d.customers)){ toast("النسخة مفيهاش قايمة عملاء"); return false; }

  DB.customers = d.customers;
  DB.tx        = Array.isArray(d.tx) ? d.tx : [];
  DB.settings  = Object.assign(DB.settings, d.settings||{});
  DB.customers.forEach(c=>touchC(c));           // ترفعها المزامنة لباقي الفروع
  DB.tx.forEach(t=>touchX(t));
  ensureInvoices(); save(); UI.open={}; UI.tab="customers"; render();
  toast(`اتسترجع ${DB.customers.length} عميل و ${DB.tx.length} حركة`);
  return true;
}

/* ---------- export / print ---------- */
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  toast("اتنزّل الملف");
}
function csv(rows){ return "\uFEFF"+rows.map(r=>r.map(c=>{ const s=String(c??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); }
function exportCustomersCsv(){
  const rows=[["اسم العميل","رقم الخط","نوع الخط","تاريخ الاستحقاق","الفاتورة الشهرية","رصيد الخط","إجمالي مديونية العميل"]];
  DB.customers.forEach(c=>c.lines.forEach(l=>rows.push([c.name,l.number,l.type,fmtDate(l.startDate),l.monthly,lineBalance(l.id),customerBalance(c.id)])));
  downloadFile(`العملاء-والخطوط-${todayISO()}.csv`, csv(rows), "text/csv");
}
function exportTxCsv(){
  const rows=[["التاريخ","العميل","رقم الخط","النوع","المبلغ","الشهر","ملاحظة"]];
  DB.tx.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{
    const c=customerById(t.customerId), f=findLine(t.lineId);
    rows.push([fmtDate(t.date), c?c.name:"", f?f.l.number:"", t.kind==="payment"?"دفعة":"فاتورة", t.amount, t.period||"", t.note||""]);
  });
  downloadFile(`الحركات-${todayISO()}.csv`, csv(rows), "text/csv");
}
function exportReportCsv(){
  const mk=UI.reportMonth;
  const rows=[[`تقرير ${monthLabel(mk)}`],["العميل","الأرقام","مستحق الشهر","دفع","متبقي","إجمالي المديونية","الحالة"]];
  DB.customers.forEach(c=>{
    const d=dueInPeriod(c.id,mk), p=paidInPeriod(c.id,mk), b=customerBalance(c.id), st=statusOf(d,p);
    if(d<=0 && p<=0 && b<=0.009) return;
    const late = st.k!=="paid" && d>0 && isLateNow(mk);
    rows.push([c.name, c.lines.map(l=>l.number).join(" | "), d, p, Math.max(0,d-p), b, late?"متأخر — "+st.txt:st.txt]);
  });
  downloadFile(`تقرير-${mk}.csv`, csv(rows), "text/csv");
}

  const view=$("#view"); view.style.display="none";
  window.print();
  setTimeout(()=>{ p.style.display="none"; p.innerHTML=""; view.style.display=""; },600);

/* ============================================================
   المزامنة بين الفروع (Google Sheet)
   كل سجل بيتبعت لوحده — الفرع بيرفع اللي اتغيّر عنده بس،
   فمفيش فرع بيمسح شغل فرع تاني.
   ============================================================ */
let SYNCING=false, syncT=null;
/* لو التطبيق شغّال جوّه حساب جوجل بتاع المستخدم، الاتصال بيتم مباشرة وبهويته */
const GAS = !!(window.google && window.google.script && window.google.script.run);
const syncOn = () => GAS || !!(DB.sync && DB.sync.url);
function callSync(body){
  if(GAS) return new Promise((ok,bad)=>{
    window.google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e=>bad(new Error((e&&e.message)||"مقدرتش أوصل لجوجل")))
      .syncApi(body);
  });
  return fetch(DB.sync.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
const pendingCount = () => Object.keys(DB.dirty.c).length + Object.keys(DB.dirty.x).length + DB.graves.length;
function timeAgo(ms){
  if(!ms) return "";
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60) return "الآن"; if(s<3600) return "من "+Math.floor(s/60)+" د";
  if(s<86400) return "من "+Math.floor(s/3600)+" س"; return "من "+Math.floor(s/86400)+" يوم";
}
function syncState(){
  if(!syncOn()) return {t:"المزامنة مقفولة", c:"off"};
  if(SYNCING)   return {t:"بيزامن…", c:"go"};
  const p = pendingCount();
  if(DB.sync.lastErr) return {t:(p?p+" في الانتظار":"فشلت المزامنة"), c:"bad"};
  if(p) return {t:p+" في الانتظار", c:"warn"};
  return {t:"متزامن "+timeAgo(DB.sync.lastOkAt), c:"ok"};
}
function refreshPill(){ const el=$("#syncPill"); if(!el) return; const s=syncState(); el.className="pill "+s.c; el.textContent=s.t; }
function scheduleSync(){ if(!syncOn()) return; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(true), 2500); refreshPill(); }
function persistNow(){
  const s=JSON.stringify(DB);
  if(window.storage){ try{ const p=window.storage.set(KEY,s); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  if(LOCAL){ try{ LOCAL.setItem(KEY,s); }catch(e){} }
}
function safeRender(){
  const a=document.activeElement;
  if($("#overlay").classList.contains("on")) return;
  if(a && $("#view").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  render();
}
function outC(c){ return {id:c.id,name:c.name,note:c.note||"",lines:c.lines||[],updatedAt:c.updatedAt||Date.now(),deleted:false}; }
function outX(t){
  const c=customerById(t.customerId), f=findLine(t.lineId);
  return {id:t.id,kind:t.kind,customerId:t.customerId,lineId:t.lineId,amount:t.amount,date:t.date,
          period:t.period||"",note:t.note||"",branch:t.branch||"",
          customerName:c?c.name:"",lineNumber:f?f.l.number:"",updatedAt:t.updatedAt||Date.now(),deleted:false};
}
function mergeRemote(d){
  (d.customers||[]).forEach(r=>{
    const i = DB.customers.findIndex(x=>x.id===r.id);
    if(r.deleted){
      if(i>=0){ DB.customers.splice(i,1); DB.tx = DB.tx.filter(t=>t.customerId!==r.id); }
      delete DB.dirty.c[r.id]; return;
    }
    if(i<0){ DB.customers.push({id:r.id,name:r.name,note:r.note,lines:r.lines||[],updatedAt:Number(r.updatedAt)||0}); }
    else if((Number(r.updatedAt)||0) > (DB.customers[i].updatedAt||0)){
      Object.assign(DB.customers[i], {name:r.name,note:r.note,lines:r.lines||[],updatedAt:Number(r.updatedAt)||0});
      delete DB.dirty.c[r.id];
    }
  });
  (d.tx||[]).forEach(r=>{
    const i = DB.tx.findIndex(x=>x.id===r.id);
    if(r.deleted){ if(i>=0) DB.tx.splice(i,1); delete DB.dirty.x[r.id]; return; }
    const rec = {id:r.id,kind:r.kind,customerId:r.customerId,lineId:r.lineId,amount:Number(r.amount)||0,
                 date:String(r.date||"").slice(0,10),period:r.period||"",note:r.note||"",branch:r.branch||"",
                 updatedAt:Number(r.updatedAt)||0};
    if(i<0) DB.tx.push(rec);
    else if((Number(r.updatedAt)||0) > (DB.tx[i].updatedAt||0)){ DB.tx[i]=rec; delete DB.dirty.x[r.id]; }
  });
}
async function syncNow(silent){
  if(!syncOn()){ if(!silent) toast("اضبط رابط المزامنة الأول"); return false; }
  if(SYNCING) return false;
  SYNCING=true; refreshPill();

  const sentC = DB.customers.filter(c=>DB.dirty.c[c.id]);
  const sentX = DB.tx.filter(t=>DB.dirty.x[t.id]);
  const graves = DB.graves.slice();
  const stampC={}, stampX={};
  sentC.forEach(c=>stampC[c.id]=c.updatedAt); sentX.forEach(t=>stampX[t.id]=t.updatedAt);

  const body = {
    key: DB.sync.key||"", since: Number(DB.sync.lastSync)||0, device: DB.sync.device, branch: DB.sync.branch||"",
    changes:{
      customers: sentC.map(outC).concat(graves.filter(g=>g.t==="c").map(g=>({id:g.id,updatedAt:g.updatedAt,deleted:true}))),
      tx:        sentX.map(outX).concat(graves.filter(g=>g.t==="x").map(g=>({id:g.id,updatedAt:g.updatedAt,deleted:true})))
    }
  };
  try{
    const d = await callSync(body);
    if(!d || !d.ok) throw new Error((d&&d.error)||"استجابة غير مفهومة");
    mergeRemote(d);
    if(d.user) DB.sync.user = d.user;
    sentC.forEach(c=>{ if(c.updatedAt===stampC[c.id]) delete DB.dirty.c[c.id]; });
    sentX.forEach(t=>{ if(t.updatedAt===stampX[t.id]) delete DB.dirty.x[t.id]; });
    const gset = new Set(graves.map(g=>g.t+g.id));
    DB.graves = DB.graves.filter(g=>!gset.has(g.t+g.id));
    DB.sync.lastSync = Number(d.now)||Date.now();
    DB.sync.lastOkAt = Date.now(); DB.sync.lastErr = "";
    ensureInvoices(); persistNow(); SYNCING=false; refreshPill(); safeRender();
    if(!silent) toast("تمت المزامنة");
    return true;
  }catch(err){
    DB.sync.lastErr = String((err&&err.message)||err).slice(0,90);
    persistNow(); SYNCING=false; refreshPill();
    if(!silent) toast("فشلت المزامنة: "+DB.sync.lastErr);
    return false;
  }
}
async function testSync(){
  if(GAS){
    try{ const d = await callSync({since:0, changes:{customers:[],tx:[]}});
      toast(d&&d.ok ? "متصل بحسابك"+(d.user?" ("+d.user+")":"")+" ✓" : "الرد غير متوقع"); }
    catch(e){ toast("مشكلة: "+String(e.message||e).slice(0,60)); }
    return;
  }
  const url = ($("#syUrl")&&$("#syUrl").value.trim()) || DB.sync.url;
  if(!url){ toast("اكتب الرابط الأول"); return; }
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url))
    toast("تنبيه: الرابط المفروض يخلص بـ /exec");
  try{
    const r = await fetch(url + (url.indexOf("?")>=0?"&":"?") + "ping=1", {method:"GET"});
    const d = await r.json();
    toast(d && d.ok ? "الاتصال تمام ✓" : "الرد غير متوقع — راجع النشر");
  }catch(e){ toast("مفيش اتصال: "+String(e.message||e).slice(0,60)); }
}

/* ---------- boot ---------- */
(async function(){
  await load();
  if(!CAN_SAVE) $("#storeWarn").style.display="block";
  const n = ensureInvoices();
  render(); refreshPill();
  if(n) toast(`اتضافت ${n} فاتورة شهرية تلقائيًا`);
  if(syncOn()){
    syncNow(true);
    setInterval(()=>{ if(!document.hidden) syncNow(true); }, 60000);
    window.addEventListener("online", ()=>syncNow(true));
    window.addEventListener("focus", ()=>syncNow(true));
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncNow(true); });
  }
})();
