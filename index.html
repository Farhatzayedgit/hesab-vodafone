<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب فودافون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A;
  --ink-2:#3C424B;
  --ink-3:#767E8A;
  --line:#E3E6EB;
  --shell:#F2F3F5;
  --paper:#FFFFFF;
  --red:#E60000;
  --red-deep:#A30000;
  --red-soft:#FFECEC;
  --green:#0B7D5B;
  --green-soft:#E6F5EF;
  --amber:#B26A00;
  --amber-soft:#FFF3DF;
  --r:14px;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 8px 24px rgba(20,22,26,.06);
  --display:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--shell);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;display:inline-block;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3}

/* ---------- shell ---------- */
.topbar{
  background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;
  border-bottom:3px solid var(--red);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.2px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--red);position:relative;flex:0 0 auto}
.dot::after{content:"";position:absolute;inset:7px 5px 5px 7px;background:#fff;border-radius:50% 50% 50% 0;transform:rotate(-12deg)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:#A9B0BB;letter-spacing:.4px}
.topsearch{flex:1 1 260px;position:relative;min-width:200px}
.topsearch input{
  width:100%;padding:10px 38px 10px 12px;border-radius:10px;border:1px solid #2C3038;
  background:#1D2027;color:#fff;outline:none
}
.topsearch input::placeholder{color:#7C8492}
.topsearch input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,0,.25)}
.topsearch span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:#7C8492;font-size:14px}
.tabs{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:30}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.tab{
  background:none;border:0;padding:13px 14px;font-weight:600;color:var(--ink-3);
  border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--display)
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 90px}
.banner{background:var(--amber-soft);border:1px solid #F0D9AE;color:#7A4B00;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}

/* ---------- generic ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700}
.card-b{padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 180px;min-width:150px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,0,.12)}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;
  font-family:var(--display);transition:.15s;white-space:nowrap
}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible{outline:3px solid rgba(230,0,0,.4);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#F3C9C9}
.btn.danger:hover{background:var(--red-soft)}
.muted{color:var(--ink-3)}
.tiny{font-size:12.5px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:6px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--ink-3)}
.kpi.red::before{background:var(--red)} .kpi.red b{color:var(--red)}
.kpi.green::before{background:var(--green)} .kpi.green b{color:var(--green)}
.kpi.amber::before{background:var(--amber)} .kpi.amber b{color:var(--amber)}

/* ---------- customer card ---------- */
.clist{display:grid;gap:12px}
.cust{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cust-h{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;flex:0 0 auto}
.cust-h .nm{flex:1;min-width:0}
.cust-h .nm b{font-family:var(--display);font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-h .nm span{font-size:12.5px;color:var(--ink-3)}
.owed{text-align:end;font-family:var(--display);font-weight:900;font-size:17px}
.owed small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--ink-3)}
.cust-b{border-top:1px dashed var(--line);padding:14px 15px;background:#FCFCFD;display:none}
.cust.open .cust-b{display:block}
.chev{color:var(--ink-3);transition:.2s;flex:0 0 auto}
.cust.open .chev{transform:rotate(180deg)}

/* SIM-card line tile = signature element */
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px}
.sim{
  position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px 11px;
  clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
}
.sim.on-time{border-color:#C9E7DB}
.sim.late{border-color:#F3C9C9}
.sim .chip{width:26px;height:20px;border-radius:4px;background:linear-gradient(#F1D08A,#D9AE55);position:relative;margin-bottom:9px}
.sim .chip::before,.sim .chip::after{content:"";position:absolute;inset-inline:3px;height:1px;background:rgba(0,0,0,.25)}
.sim .chip::before{top:7px}.sim .chip::after{top:13px}
.sim .no{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.4px}
.sim .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.sim .amt{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.sim .amt b{font-family:var(--display);font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.b-new{background:var(--red-soft);border-color:#F5C6C6;color:var(--red-deep)}
.b-tr{background:#EEF2FF;border-color:#D3DCFA;color:#2A3E9B}
.b-paid{background:var(--green-soft);border-color:#C9E7DB;color:var(--green)}
.b-part{background:var(--amber-soft);border-color:#F0D9AE;color:var(--amber)}
.b-un{background:var(--red-soft);border-color:#F5C6C6;color:var(--red-deep)}
.b-gray{background:var(--shell);border-color:var(--line);color:var(--ink-3)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:start;font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--ink-3);
  padding:10px 12px;border-bottom:1px solid var(--line);background:#FBFBFC;white-space:nowrap
}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FBFBFC}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.late-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;z-index:60;padding:16px;overflow:auto}
.overlay.on{display:block}
.modal{background:var(--paper);max-width:760px;margin:24px auto;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px}
.modal-b{padding:18px;max-height:70vh;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start;background:#FBFBFC}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}

.lrow{display:grid;grid-template-columns:1.3fr .9fr 1fr .9fr auto;gap:8px;align-items:end;margin-bottom:9px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#FBFBFC}
@media(max-width:720px){.lrow{grid-template-columns:1fr 1fr}}

/* ---------- toast ---------- */
#toast{position:fixed;inset-inline:0;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:90}
#toast div{
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(16px);opacity:0;transition:.25s
}
#toast div.on{transform:none;opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- invoice ---------- */
.inv{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;max-width:760px;margin:0 auto}
.inv-h{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.inv-h h2{font-size:22px;font-weight:900}
.inv-h .t{text-align:end;font-size:13px;color:var(--ink-3)}
.inv-to{background:var(--shell);border-radius:11px;padding:12px 14px;margin-bottom:16px}
.inv-to b{font-family:var(--display);font-size:18px}
.tot{margin-top:16px;margin-inline-start:auto;max-width:340px}
.tot div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.tot div.big{border-bottom:0;border-top:2px solid var(--ink);margin-top:6px;padding-top:11px;font-family:var(--display);font-weight:900;font-size:18px}
.stamp{margin-top:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;color:var(--ink-3);font-size:12.5px}
#printArea{display:none}
@media print{
  body{background:#fff}
  .topbar,.tabs,.noprint,#toast,.overlay{display:none!important}
  main{padding:0;max-width:none}
  .inv{border:0;padding:0;max-width:none}
  .card{border:0;box-shadow:none}
  th{background:#fff}
}
</style>
</head>

  <div class="topbar-in">
    <div class="brand"><span class="dot"></span><span>حساب فودافون<small>إدارة خطوط وفواتير العملاء</small></span></div>
    <div class="topsearch">
      <span>&#128269;</span>
      <input id="q" type="text" placeholder="ابحث بالاسم أو برقم الخط… (اكتب الاسم والرقم معًا للبحث المزدوج)" autocomplete="off">

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ============================================================
   حساب فودافون — تطبيق واحد بملف واحد
   البيانات: عملاء ← خطوط ← حركات (فاتورة / دفعة)
   ============================================================ */

const KEY = "hesab_vodafone_v1";
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

let DB = {
  customers: [],
  tx: [],
  settings: { reportDay: 8, generateOnDueDate: false, chargeMode: "auto", shopName: "حساب فودافون", currency: "ج.م" },
  meta: { created: new Date().toISOString() }
};
let UI = { tab:"customers", q:"", reportMonth:monthKey(new Date()), filter:"all", open:{}, invCustomer:"", invMonth:monthKey(new Date()), renewMonth:monthKey(new Date()), renewSel:{} };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const digits = s => String(s??"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function monthKey(d){ d = new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(mk){ const [y,m]=mk.split("-"); return AR_MONTHS[Number(m)-1]+" "+y; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dueDateOf(mk, day){ const [y,m]=mk.split("-").map(Number); const d=Math.min(day||1, daysInMonth(y,m)); return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function monthsFrom(startMk, endMk){
  const out=[]; let [y,m]=startMk.split("-").map(Number); const [ey,em]=endMk.split("-").map(Number);
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard++<400){ out.push(y+"-"+String(m).padStart(2,"0")); m++; if(m>12){m=1;y++;} }
  return out;
}
function toast(msg){
  const box=$("#toast"); box.innerHTML="";
  const d=document.createElement("div"); d.textContent=msg; box.appendChild(d);
  requestAnimationFrame(()=>d.classList.add("on"));
  setTimeout(()=>{ d.classList.remove("on"); setTimeout(()=>d.remove(),300); },2600);
}
function parseDateLoose(v){
  if(!v) return "";
  v = digits(String(v).trim());
  let m;
  if((m = v.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m = v.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/))) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if((m = v.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2})$/))) return `20${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const d = new Date(v); return isNaN(d) ? "" : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseNum(v){ const n = parseFloat(digits(String(v??"")).replace(/[^\d.\-]/g,"")); return isNaN(n)?0:n; }

/* ---------- storage: Firebase (سحابة) + localStorage (احتياطي) ---------- */
const firebaseConfig = window.firebaseConfig || {};
const USE_LOGIN = !!window.USE_LOGIN;
let CLOUD = false;        // متصل بـ Firebase؟
let cloudReady = false;   // تم التحميل الأول؟
let dbref = null;
let saveT = null;
let ignoreNext = false;   // لتجاهل صدى الكتابة الخاصة بنا

function isConfigured(){ return !!(firebaseConfig.apiKey && firebaseConfig.databaseURL && window.firebase); }
function toArr(v){ return Array.isArray(v) ? v : (v && typeof v==="object" ? Object.values(v) : []); }
function mergeDB(d){
  d = d || {};
  DB = Object.assign({customers:[],tx:[],settings:{},meta:{created:new Date().toISOString()}}, d);
  DB.customers = toArr(DB.customers);
  DB.tx = toArr(DB.tx);
  DB.customers.forEach(c=>{ c.lines = toArr(c.lines); c.lines.forEach(l=>{ if(l.addons!=null) l.addons = toArr(l.addons); }); });
  DB.settings = Object.assign({reportDay:8,generateOnDueDate:false,chargeMode:"auto",shopName:"حساب فودافون",currency:"ج.م"}, d.settings||{});
}
function setStatus(state, extra){
  const b = $("#storeWarn"); if(!b) return;
  if(state==="cloud"){ b.style.display="none"; }
  else if(state==="local"){ b.style.display="block"; b.style.background="#FFF3DF"; b.style.borderColor="#F0D9AE";
    b.innerHTML = "التطبيق شغّال بالتخزين المحلي على الجهاز ده فقط (مفيش إعدادات Firebase). البيانات مش بتتزامن مع أجهزة تانية."; }
  else if(state==="error"){ b.style.display="block"; b.style.background="#FFECEC"; b.style.borderColor="#F5C6C6";
    b.innerHTML = "تعذّر الاتصال بالسحابة"+(extra?" — "+esc(extra):"")+". اتأكد من إعدادات Firebase وقواعد قاعدة البيانات."; }
}

/* التحميل الأولي (يُستدعى مرة واحدة) */
async function load(){
  if(isConfigured()){
    try{
      try{ firebase.initializeApp(firebaseConfig); }catch(e){/* مهيّأ بالفعل */}
      CLOUD = true;
      return; // الربط الفعلي بيتم في boot() بعد التأكد من تسجيل الدخول
    }catch(e){ CLOUD=false; }
  }
  // احتياطي: تخزين محلي على نفس الجهاز
  CLOUD = false;
  try{ const s = localStorage.getItem(KEY); if(s) mergeDB(JSON.parse(s)); }catch(e){}
}

/* الاشتراك اللحظي في بيانات السحابة */
function bindCloud(onFirst){
  dbref = firebase.database().ref("data");
  dbref.on("value", snap=>{
    if(ignoreNext){ ignoreNext=false; if(!cloudReady){ cloudReady=true; onFirst&&onFirst(); } return; }
    const val = snap.val();
    if(val) mergeDB(val);
    if(!cloudReady){ cloudReady=true; onFirst&&onFirst(); }
    else { ensureInvoices(); render(); }
  }, err=>{ setStatus("error", err&&err.message); });
}

function save(){
  clearTimeout(saveT);
  if(CLOUD){
    if(!cloudReady) return;
    saveT = setTimeout(()=>{
      ignoreNext = true;
      const payload = JSON.parse(JSON.stringify(DB)); // يشيل أي undefined
      dbref.set(payload).then(()=>setStatus("cloud")).catch(err=>{ ignoreNext=false; setStatus("error", err&&err.message); });
    }, 400);
  }else{
    saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }, 250);
  }
}

/* ---------- data model ---------- */
function customerById(id){ return DB.customers.find(c=>c.id===id); }
function allLines(){ const out=[]; DB.customers.forEach(c=>c.lines.forEach(l=>out.push({c,l}))); return out; }
function findLine(lineId){ for(const c of DB.customers){ const l=c.lines.find(x=>x.id===lineId); if(l) return {c,l}; } return null; }

/* توليد الفواتير الشهرية تلقائيًا لكل خط من تاريخ استحقاقه حتى الشهر الحالي */
function ensureInvoices(){
  if(DB.settings.chargeMode==="manual") return 0; // الفوترة يدوية عبر «تجديد الباقات»
  const nowMk = monthKey(new Date());
  const today = todayISO();
  let added = 0;
  const have = new Set(DB.tx.filter(t=>t.kind==="invoice").map(t=>t.lineId+"|"+t.period));
  DB.customers.forEach(c=>{
    c.lines.forEach(l=>{
      if(l.stopped) return;
      const start = l.startDate ? monthKey(l.startDate) : nowMk;
      if(start > nowMk) return;
      const day = l.startDate ? Number(String(l.startDate).slice(8,10)) : 1;
      monthsFrom(start, nowMk).forEach(mk=>{
        const key = l.id+"|"+mk;
        if(have.has(key)) return;
        const due = dueDateOf(mk, day);
        // الشهر الأول يبدأ من تاريخ العرض؛ والشهر الحالي: إمّا أول الشهر أو يوم الاستحقاق حسب الإعداد
        if(mk===nowMk && DB.settings.generateOnDueDate && due>today) return;
        DB.tx.push({ id:uid(), kind:"invoice", customerId:c.id, lineId:l.id, amount:Number(l.monthly)||0, date:due, period:mk, note:"فاتورة شهر "+monthLabel(mk) });
        have.add(key); added++;
      });
    });
  });
  if(added){ save(); }
  return added;
}

function txOfLine(id){ return DB.tx.filter(t=>t.lineId===id); }
/* الإضافة الملغاة لا تُحتسب في أي رصيد */
function isVoidExtra(t){ return t.kind==="extra" && t.status==="ملغاة"; }
function lineBalance(id){
  let b=0; for(const t of DB.tx){ if(t.lineId!==id||isVoidExtra(t)) continue; b += (t.kind==="payment" ? -t.amount : t.amount); }
  return Math.round(b*100)/100;
}
function customerBalance(cid){
  let b=0; for(const t of DB.tx){ if(t.customerId!==cid||isVoidExtra(t)) continue; b += (t.kind==="payment" ? -t.amount : t.amount); }
  return Math.round(b*100)/100;
}
function dueInPeriod(cid, mk, lineId){
  return DB.tx.filter(t=>t.kind!=="payment" && !isVoidExtra(t) && t.customerId===cid && t.period===mk && (!lineId||t.lineId===lineId))
              .reduce((s,t)=>s+t.amount,0);
}
function paidInPeriod(cid, mk, lineId){
  return DB.tx.filter(t=>t.kind==="payment" && t.customerId===cid && String(t.date).slice(0,7)===mk && (!lineId||t.lineId===lineId))
              .reduce((s,t)=>s+t.amount,0);
}
function statusOf(due, paid){
  if(due<=0 && paid<=0) return {k:"none", txt:"لا يوجد مستحق", cls:"b-gray"};
  if(paid<=0) return {k:"unpaid", txt:"لم يدفع", cls:"b-un"};
  if(paid+0.009 >= due) return {k:"paid", txt:"دفع", cls:"b-paid"};
  return {k:"partial", txt:"دفع جزئي", cls:"b-part"};
}
function isLateNow(mk){
  const now = new Date(); const cur = monthKey(now);
  if(mk < cur) return true;
  if(mk > cur) return false;
  return now.getDate() >= (Number(DB.settings.reportDay)||8);
}
/* دفعة على مستوى العميل: تُخصم من أقدم مديونية أولًا */
function payCustomer(cid, amount, date, note){
  const c = customerById(cid); if(!c) return 0;
  let left = Number(amount)||0;
  const ordered = c.lines.slice().sort((a,b)=>String(a.startDate||"").localeCompare(String(b.startDate||"")));
  for(const l of ordered){
    if(left<=0.009) break;
    const bal = lineBalance(l.id);
    if(bal<=0.009) continue;
    const pay = Math.min(bal,left);
    DB.tx.push({id:uid(),kind:"payment",customerId:cid,lineId:l.id,amount:pay,date,period:String(date).slice(0,7),note:note||"دفعة"});
    left -= pay;
  }
  if(left>0.009 && ordered.length){ // دفع مقدم / زيادة
    const l = ordered[0];
    DB.tx.push({id:uid(),kind:"payment",customerId:cid,lineId:l.id,amount:left,date,period:String(date).slice(0,7),note:(note?note+" — ":"")+"دفع مقدّم"});
  }
  save(); return amount;
}

/* ============================================================
   تجديد الباقة — عملية مستقلة مربوطة بحساب العميل
   القاعدة: سعر الباقة والإضافات بيتسجّلوا وقت التجديد (لقطة ثابتة)،
   حتى لو اتغيّر سعر الباقة بعد كده — التجديدات القديمة ما بتتأثرش.
   ============================================================ */
function addonsOf(l){ return Array.isArray(l.addons)?l.addons:[]; }
function addonsSum(l){ return Math.round(addonsOf(l).reduce((s,a)=>s+(Number(a.amount)||0),0)*100)/100; }
function pkgPrice(l){ return Number(l.monthly)||0; }
function renewCharge(l){ return Math.round((pkgPrice(l)+addonsSum(l))*100)/100; }   // قيمة التجديد الجديدة (باقة + إضافات)
function hasChargeInPeriod(lineId, mk){ return DB.tx.some(t=>(t.kind==="invoice"||t.kind==="renewal") && t.lineId===lineId && t.period===mk); }
function renewalOfPeriod(lineId, mk){ return DB.tx.find(t=>t.kind==="renewal" && t.lineId===lineId && t.period===mk); }
function renewDate(l, mk){
  const day = l.startDate ? (Number(String(l.startDate).slice(8,10))||1) : 1;
  return (mk===monthKey(new Date())) ? todayISO() : dueDateOf(mk, day);
}
/* ينشئ تجديدًا واحدًا لخط في شهر معيّن — يتجاهل لو الشهر متسجّل له فاتورة/تجديد بالفعل أو الباقة منتهية */
function renewLine(lineId, mk){
  const f = findLine(lineId); if(!f) return null;
  const {c,l} = f;
  if(hasChargeInPeriod(l.id, mk)) return null;
  if(isExpired(l)) return null; // ممنوع تجديد باقة منتهية قبل تعديل تاريخ الانتهاء
  const adds = addonsOf(l).map(a=>({name:(a.name||"إضافة"), amount:Number(a.amount)||0})).filter(a=>a.amount||a.name);
  const pkg  = pkgPrice(l);
  const amount = Math.round((pkg + adds.reduce((s,a)=>s+a.amount,0))*100)/100;
  const note = "تجديد باقة " + monthLabel(mk) + (adds.length ? " — إضافات: " + adds.map(a=>`${a.name} ${money(a.amount)}`).join("، ") : "");
  const tx = { id:uid(), kind:"renewal", customerId:c.id, lineId:l.id, amount, date:renewDate(l,mk), period:mk, packagePrice:pkg, addons:adds, note };
  DB.tx.push(tx);
  return tx;
}
/* الخطوط المؤهّلة للتجديد في شهر معيّن حسب نتيجة البحث الحالية (تستبعد المنتهية) */
function renewEligibleLines(mk){
  const out=[];
  searchCustomers(UI.q).forEach(c=>c.lines.forEach(l=>{ if(!l.stopped && !isExpired(l) && !hasChargeInPeriod(l.id,mk)) out.push({c,l}); }));
  return out;
}

/* ============================================================
   تاريخ الانتهاء — الباقة صالحة حتى هذا التاريخ (شامل).
   بعد مروره تُعتبر منتهية ولا يُسمح بالتجديد إلا بعد تعديل التاريخ.
   ============================================================ */
function expiryOf(l){ return l && l.startDate ? String(l.startDate).slice(0,10) : ""; }
function isExpired(l){ const e=expiryOf(l); return !!e && todayISO() > e; }
function expiresToday(l){ const e=expiryOf(l); return !!e && todayISO() === e; }
function expiredLinesIn(list){ const out=[]; (list||DB.customers).forEach(c=>c.lines.forEach(l=>{ if(!l.stopped && isExpired(l)) out.push({c,l}); })); return out; }

/* ============================================================
   الإضافات — مبالغ إضافية على حساب العميل مع سبب وتاريخ وحالة.
   تُضاف تلقائيًا لرصيد العميل وتظهر منفصلة عن سعر الباقة في الفاتورة.
   الحالة: "مستحقة" (تُحتسب) أو "ملغاة" (لا تُحتسب).
   ============================================================ */
function firstLineId(cid){ const c=customerById(cid); return c && c.lines[0] ? c.lines[0].id : ""; }
function extrasOf(cid){ return DB.tx.filter(t=>t.kind==="extra" && t.customerId===cid); }
function extrasInPeriod(cid, mk){ return DB.tx.filter(t=>t.kind==="extra" && !isVoidExtra(t) && t.customerId===cid && t.period===mk); }
function addExtra(cid, amount, reason, date, status){
  const c=customerById(cid); if(!c) return null;
  date = date || todayISO();
  const tx = { id:uid(), kind:"extra", customerId:cid, lineId:firstLineId(cid), amount:Math.round((Number(amount)||0)*100)/100,
    date, period:String(date).slice(0,7), reason:(reason||"").trim()||"إضافة", status:(status==="ملغاة"?"ملغاة":"مستحقة"),
    note:"إضافة: "+((reason||"").trim()||"—") };
  DB.tx.push(tx);
  return tx;
}

/* ---------- search ---------- */
/* يقبل: اسم فقط / رقم فقط / الاثنين معًا (الاسم + الرقم = بحث مزدوج) */
function searchCustomers(q){
  q = digits(String(q||"").trim());
  if(!q) return DB.customers.slice();
  const tokens = q.split(/\s+/).filter(Boolean);
  const numTok = tokens.filter(t=>/^\d{3,}$/.test(t));
  const txtTok = tokens.filter(t=>!/^\d{3,}$/.test(t));
  return DB.customers.filter(c=>{
    const nameOk = txtTok.length===0 || txtTok.every(t=>c.name.includes(t) || (c.note||"").includes(t));
    const numOk  = numTok.length===0 || numTok.every(t=>c.lines.some(l=>digits(l.number||"").includes(t)));
    return nameOk && numOk;
  });
}
function matchedLines(c,q){
  const numTok = digits(String(q||"")).split(/\s+/).filter(t=>/^\d{3,}$/.test(t));
  if(!numTok.length) return null;
  return c.lines.filter(l=>numTok.some(t=>digits(l.number||"").includes(t)));
}

/* ---------- تجديد الباقات ---------- */
function viewRenew(){
  const mk = UI.renewMonth;
  const list = searchCustomers(UI.q);

  // شهور متاحة للاختيار (من أقدم استحقاق للشهر الجاي)
  const startMk = (()=>{ const ds=DB.customers.flatMap(c=>c.lines.map(l=>l.startDate)).filter(Boolean).sort(); return ds.length?monthKey(ds[0]):monthKey(new Date()); })();
  const next = (()=>{ const d=new Date(); d.setMonth(d.getMonth()+1); return monthKey(d); })();
  const months = monthsFrom(startMk, next).reverse();

  // أرقام مجمّعة للـ KPIs
  let eligibleCount=0, renewedCount=0, eligibleTotal=0, expiredCount=0;
  list.forEach(c=>c.lines.forEach(l=>{
    if(l.stopped) return;
    if(isExpired(l)){ expiredCount++; return; }
    if(hasChargeInPeriod(l.id,mk)){ renewedCount++; }
    else { eligibleCount++; eligibleTotal += renewCharge(l); }
  }));

  // إجماليات المحدَّد
  const selIds = Object.keys(UI.renewSel).filter(id=>UI.renewSel[id]);
  let selCount=0, selNew=0, selTotal=0;
  selIds.forEach(id=>{ const f=findLine(id); if(!f||hasChargeInPeriod(id,mk)) return; selCount++; selNew+=renewCharge(f.l); selTotal+=lineBalance(id)+renewCharge(f.l); });

  const cur = esc(DB.settings.currency);

  let html = `
  <div class="kpis">
    <div class="kpi"><span>خطوط قابلة للتجديد — ${monthLabel(mk)}</span><b class="num">${eligibleCount}</b></div>
    <div class="kpi green"><span>مُجدّدة بالفعل هذا الشهر</span><b class="num">${renewedCount}</b></div>
    <div class="kpi red"><span>إجمالي التجديد لو جدّدت الكل</span><b><span class="num">${money(eligibleTotal)}</span> ${cur}</b></div>
    <div class="kpi ${expiredCount?"red":""}"><span>باقات منتهية</span><b class="num">${expiredCount}</b></div>
    <div class="kpi amber"><span>محدَّد الآن</span><b class="num">${selCount}</b></div>
  </div>`;

  html += `
  <div class="card" style="margin-bottom:16px"><div class="card-b">
    <div class="row" style="justify-content:space-between">
      <div class="grow" style="max-width:240px"><label>شهر التجديد</label>
        <select id="renewMonth">${months.map(m=>`<option value="${m}" ${m===mk?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <button class="btn sm" data-act="renewSelectAll">تحديد كل المؤهّل</button>
        <button class="btn sm" data-act="renewSelectNone">إلغاء التحديد</button>
      </div>
    </div>
    <p class="tiny muted" style="margin-bottom:0">
      اختر الخطوط ثم اضغط «تجديد الباقات المحددة». سعر الباقة والإضافات بيتسجّلوا وقت التجديد،
      والإجمالي = <b>الباقة + الإضافات + الحساب السابق</b>. بعد التجديد بتقدر تسجّل السداد على طول.
      ${DB.settings.chargeMode!=="manual"?`<br><b style="color:var(--amber)">ملاحظة:</b> الفاتورة التلقائية شغّالة. لو عايز التجديد يكون الطريقة الوحيدة لإضافة الفواتير، فعّل «الفوترة اليدوية» من الإعدادات.`:``}
    </p>
  </div></div>`;

  if(!list.length){
    return html + `<div class="card"><div class="empty"><b>مفيش عملاء</b>أضف عميلًا أولًا من تبويب «العملاء والخطوط».</div></div>`;
  }

  if(expiredCount){
    html += `<div class="card" style="margin-bottom:16px;border-color:#F5C6C6;background:var(--red-soft)"><div class="card-b" style="color:var(--red-deep);margin:0">
      <b>⚠ فيه <span class="num">${expiredCount}</span> باقة وصلت تاريخ انتهائها.</b>
      مش هتقدر تجدّدها إلا لما تعدّل «تاريخ الانتهاء» بتاعها من بيانات العميل الأول (زرار «عدّل التاريخ» جنب الخط بالأسفل).
    </div></div>`;
  }

  html += `<div class="tbl-wrap card" style="padding:0"><table><thead><tr>
    <th style="width:34px"></th><th>الخط</th><th class="n">سعر الباقة</th><th class="n">الإضافات</th>
    <th class="n">الحساب السابق</th><th class="n">الإجمالي المطلوب</th><th>الحالة</th>
  </tr></thead><tbody>`;

  list.forEach(c=>{
    const eligLines = c.lines.filter(l=>!l.stopped && !isExpired(l) && !hasChargeInPeriod(l.id,mk));
    const allSel = eligLines.length>0 && eligLines.every(l=>UI.renewSel[l.id]);
    html += `<tr style="background:var(--shell)">
      <td>${eligLines.length?`<input type="checkbox" class="renew-cust" data-cid="${c.id}" ${allSel?"checked":""} title="تحديد كل خطوط العميل">`:""}</td>
      <td colspan="6"><b>${esc(c.name)}</b> <span class="tiny muted">· <span class="num">${c.lines.length}</span> خط · رصيد حالي <b class="num" style="color:${customerBalance(c.id)>0.009?"var(--red)":"var(--green)"}">${money(customerBalance(c.id))}</b> ${cur}</span></td>
    </tr>`;

    c.lines.forEach(l=>{
      const pkg = pkgPrice(l), add = addonsSum(l), prev = lineBalance(l.id);
      const addList = addonsOf(l);
      const charged = hasChargeInPeriod(l.id, mk);
      const expired = isExpired(l);
      const rnw = renewalOfPeriod(l.id, mk);
      const total = prev + renewCharge(l);
      const checked = !!UI.renewSel[l.id];
      const addCell = add>0
        ? `<b class="num">${money(add)}</b>${addList.length?`<br><span class="tiny muted">${addList.map(a=>esc(a.name)+" "+money(a.amount)).join(" · ")}</span>`:""}`
        : `<span class="tiny muted">—</span>`;
      const cbCell = l.stopped ? `<span class="tiny muted">موقوف</span>`
                   : expired    ? ``
                   : charged     ? ``
                   : `<input type="checkbox" class="renew-cb" data-line="${l.id}" data-cid="${c.id}" ${checked?"checked":""}>`;
      const statusCell = expired
          ? `<span class="badge b-un">منتهية</span>`
          : charged
              ? `<span class="badge b-paid">مُجدّدة</span>${rnw?`<br><span class="tiny muted">بـ <span class="num">${money(rnw.amount)}</span></span>`:""}`
              : `<span class="badge b-gray">جاهزة للتجديد</span>`;
      html += `<tr${expired?` style="background:#FFF7F7"`:``}>
        <td>${cbCell}</td>
        <td><b class="num">${esc(l.number||"—")}</b> <span class="badge ${l.type==="تحويل"?"b-tr":"b-new"}">${esc(l.type||"جديد")}</span>
            <div class="tiny ${expired?"":"muted"}" style="margin-top:2px;${expired?"color:var(--red)":""}">تنتهي ${fmtDate(l.startDate)}</div>
            <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn sm" data-act="editAddons" data-line="${l.id}">تعديل الإضافات</button>
              ${expired?`<button class="btn sm danger" data-act="edit" data-id="${c.id}">عدّل التاريخ</button>`:``}
            </div></td>
        <td class="n num">${money(pkg)}</td>
        <td class="n">${addCell}</td>
        <td class="n num" style="color:${prev>0.009?"var(--red)":prev<-0.009?"var(--green)":"var(--ink-3)"}">${money(prev)}</td>
        <td class="n num" style="font-weight:800;color:var(--ink)">${(charged||expired)?money(prev):money(total)}</td>
        <td>${statusCell}</td>
      </tr>`;
    });
  });
  html += `</tbody></table></div>`;

  // شريط الإجراء السفلي
  html += `
  <div class="card noprint" style="margin-top:16px;position:sticky;bottom:0"><div class="card-b">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <div class="tiny muted">محدَّد <b class="num">${selCount}</b> خط · تجديد جديد <b class="num" style="color:var(--red)">${money(selNew)}</b> ${cur}</div>
        <div style="font-family:var(--display);font-weight:900;font-size:20px">الإجمالي المطلوب سداده: <span class="num">${money(selTotal)}</span> ${cur}</div>
      </div>
      <button class="btn primary" data-act="renewReview" ${selCount?"":"disabled style=\"opacity:.5;cursor:not-allowed\""}>تجديد الباقات المحددة</button>
    </div>
  </div></div>`;

  return html;
}

function viewReports(){
  const mk = UI.reportMonth;
  const rows = DB.customers.map(c=>{
    const d = dueInPeriod(c.id,mk), p = paidInPeriod(c.id,mk), b = customerBalance(c.id);
    const st = statusOf(d,p);
    return {c,d,p,rest:Math.max(0,d-p),b,st};
  }).filter(r=>r.d>0 || r.p>0 || r.b>0.009);

  const f = UI.filter;
  const shown = rows.filter(r=> f==="all" ? true : f==="paid" ? r.st.k==="paid" : f==="unpaid" ? r.st.k==="unpaid" : f==="partial" ? r.st.k==="partial" : r.b>0.009 );
  const T = rows.reduce((a,r)=>({d:a.d+r.d,p:a.p+r.p,rest:a.rest+r.rest,b:a.b+Math.max(0,r.b)}),{d:0,p:0,rest:0,b:0});
  const late = isLateNow(mk);

  const months = (()=>{
    const s = new Set(DB.tx.map(t=>t.period).filter(Boolean)); s.add(monthKey(new Date()));
    return [...s].sort().reverse();
  })();

  let html = `
  <div class="card noprint" style="margin-bottom:16px"><div class="card-b">
    <div class="row">
      <div class="grow"><label>الشهر</label><select id="repMonth">${months.map(m=>`<option value="${m}" ${m===mk?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
      <div class="grow"><label>الفلتر</label><select id="repFilter">
        <option value="all" ${f==="all"?"selected":""}>الكل</option>
        <option value="unpaid" ${f==="unpaid"?"selected":""}>لم يدفعوا</option>
        <option value="partial" ${f==="partial"?"selected":""}>دفعوا جزئيًا</option>
        <option value="paid" ${f==="paid"?"selected":""}>دفعوا بالكامل</option>
        <option value="debt" ${f==="debt"?"selected":""}>عليهم مديونية متراكمة</option>
      </select></div>
      <div class="grow"><label>يوم التقرير</label><input type="number" id="repDay" min="1" max="28" value="${Number(DB.settings.reportDay)||8}"></div>
      <div><button class="btn" data-act="printReport">طباعة التقرير</button></div>
      <div><button class="btn" data-act="csvReport">تصدير Excel</button></div>
    </div>
    <div class="tiny muted" style="margin-top:9px">
      ${late ? `عدّى يوم <span class="num">${DB.settings.reportDay}</span> — اللي مدفعش لحد دلوقتي محسوب <b style="color:var(--red)">متأخر</b>.`
             : `لسه بدري — يوم التقرير هو <span class="num">${DB.settings.reportDay}</span> من الشهر.`}
    </div>
  </div></div>

  <div class="kpis">
    <div class="kpi"><span>مستحق ${monthLabel(mk)}</span><b><span class="num">${money(T.d)}</span></b></div>
    <div class="kpi green"><span>المحصّل</span><b><span class="num">${money(T.p)}</span></b></div>
    <div class="kpi amber"><span>متبقي من الشهر</span><b><span class="num">${money(T.rest)}</span></b></div>
    <div class="kpi red"><span>إجمالي المديونية المتراكمة</span><b><span class="num">${money(T.b)}</span></b></div>
  </div>

  <div class="card"><div class="card-h">
    <h3>تقرير ${monthLabel(mk)} — مين دفع ومين لأ</h3>
    <span class="tiny muted"><span class="num">${shown.length}</span> عميل</span>
  </div><div class="card-b" style="padding:0">`;

  if(!shown.length){ return html + `<div class="empty"><b>مفيش بيانات للعرض</b>غيّر الشهر أو الفلتر.</div></div></div>`; }

  html += `<div class="tbl-wrap"><table><thead><tr>
    <th>العميل</th><th>الأرقام</th><th class="n">مستحق الشهر</th><th class="n">دفع</th><th class="n">متبقي</th><th class="n">إجمالي المديونية</th><th>الحالة</th><th class="noprint"></th>
  </tr></thead><tbody>`;
  shown.forEach(r=>{
    const isLate = r.st.k!=="paid" && r.d>0 && late;
    html += `<tr class="${isLate?"late-row":""}">
      <td><b>${esc(r.c.name)}</b></td>
      <td class="tiny muted num">${r.c.lines.map(l=>esc(l.number)).join(" · ")}</td>
      <td class="n num">${money(r.d)}</td>
      <td class="n num" style="color:var(--green)">${money(r.p)}</td>
      <td class="n num" style="color:${r.rest>0.009?"var(--red)":"var(--ink-3)"}">${money(r.rest)}</td>
      <td class="n num" style="font-weight:700;color:${r.b>0.009?"var(--red)":"var(--ink-3)"}">${money(r.b)}</td>
      <td><span class="badge ${isLate?"b-un":r.st.cls}">${isLate?"متأخر":r.st.txt}</span></td>
      <td class="noprint"><button class="btn sm" data-act="detail" data-id="${r.c.id}">تفاصيل الأرقام</button></td>
    </tr>`;
  });
  html += `</tbody></table></div></div></div>

  <div class="card noprint" style="margin-top:16px"><div class="card-h"><h3>مديونية رقم معيّن</h3></div><div class="card-b">

      <div class="grow"><label>اكتب رقم الخط</label><input type="text" id="lineQ" placeholder="مثال: 0100 123 4567" value="${esc(UI.lineQ||"")}"></div>
      <div><button class="btn dark" data-act="lineLookup">اعرض كشف الرقم</button></div>
    </div>
    <div id="lineResult" style="margin-top:14px">${UI.lineQ?lineLookupHtml(UI.lineQ):""}</div>
  </div></div>`;
  return html;
}
function lineLookupHtml(q){
  const qq = digits(q).replace(/\D/g,"");
  if(!qq) return `<div class="tiny muted">اكتب رقم أو آخر ٤ أرقام.</div>`;
  const hits = allLines().filter(x=>digits(x.l.number||"").replace(/\D/g,"").includes(qq));
  if(!hits.length) return `<div class="empty"><b>مفيش رقم مطابق</b>جرّب آخر ٤ أرقام بس.</div>`;
  return hits.map(({c,l})=>{
    const b = lineBalance(l.id);
    const tx = txOfLine(l.id).sort((a,z)=>String(z.date).localeCompare(String(a.date))).slice(0,14);
    return `<div class="card" style="margin-bottom:12px;box-shadow:none">
      <div class="card-h"><h3>${esc(l.number)} — ${esc(c.name)}</h3>
      <span class="badge ${b>0.009?"b-un":"b-paid"}">${b>0.009?"مديونية "+money(b):"خالص"} ${esc(DB.settings.currency)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">فاتورة</th><th class="n">دفع</th></tr></thead><tbody>
      ${tx.map(t=>`<tr><td class="num">${fmtDate(t.date)}</td><td class="tiny">${esc(t.note||"")}</td>
        <td class="n num">${t.kind!=="payment"?money(t.amount):"—"}</td>
        <td class="n num" style="color:var(--green)">${t.kind==="payment"?money(t.amount):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
}

  const cid = UI.invCustomer || (DB.customers[0]&&DB.customers[0].id) || "";
  let html = `<div class="card noprint" style="margin-bottom:16px"><div class="card-b"><div class="row">
    <div class="grow"><label>العميل</label><select id="invCust">${DB.customers.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.name)}</option>`).join("")||`<option>لا يوجد عملاء</option>`}</select></div>
    <div class="grow"><label>الشهر</label><select id="invMonth">${months.map(m=>`<option value="${m}" ${m===UI.invMonth?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
    <div><button class="btn primary" data-act="printInvoice">طباعة</button></div>
    <div><button class="btn" data-act="saveInvoice">حفظ كملف</button></div>
  </div></div></div>`;
  if(!cid) return html + `<div class="card"><div class="empty"><b>اختر عميلًا أولًا</b>أضف عميل من تبويب «العملاء والخطوط».</div></div>`;
  return html + invoiceHtml(cid, UI.invMonth);
}
function invoiceHtml(cid, mk){
  const c = customerById(cid); if(!c) return "";
  const day = Number(DB.settings.reportDay)||8;
  const rows = c.lines.map(l=>{
    const inv = DB.tx.filter(t=>(t.kind==="invoice"||t.kind==="renewal") && t.lineId===l.id && t.period===mk).reduce((s,t)=>s+t.amount,0);
    const pay = DB.tx.filter(t=>t.kind==="payment" && t.lineId===l.id && String(t.date).slice(0,7)===mk).reduce((s,t)=>s+t.amount,0);
    return {l,inv,pay,bal:lineBalance(l.id)};
  });
  const extras = extrasInPeriod(cid, mk);                 // الإضافات المستحقة في نفس الشهر
  const pkgDue = rows.reduce((s,r)=>s+r.inv,0);
  const extraDue = extras.reduce((s,t)=>s+t.amount,0);
  const monthDue = pkgDue + extraDue;
  const monthPaid = rows.reduce((s,r)=>s+r.pay,0);
  const totalBal = customerBalance(cid);
  const prev = totalBal - monthDue + monthPaid;
  const cur = esc(DB.settings.currency);
  return `<div class="inv" id="invBox">
    <div class="inv-h">
      <div><h2>${esc(DB.settings.shopName||"حساب فودافون")}</h2><div class="tiny muted">فاتورة خدمات خطوط شهرية</div></div>
      <div class="t">فاتورة شهر<br><b style="font-family:var(--display);font-size:18px;color:var(--ink)">${monthLabel(mk)}</b>
      <br>تاريخ الإصدار: <span class="num">${fmtDate(dueDateOf(mk,day))}</span></div>
    </div>
    <div class="inv-to"><div class="tiny muted">العميل</div><b>${esc(c.name)}</b>
      <div class="tiny muted"><span class="num">${c.lines.length}</span> خط · ${c.note?esc(c.note):"—"}</div></div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>#</th><th>رقم الخط</th><th>النوع</th><th>تاريخ الانتهاء</th><th class="n">سعر الباقة</th><th class="n">المدفوع</th><th class="n">رصيد الخط</th>
    </tr></thead><tbody>
    ${rows.map((r,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td class="num"><b>${esc(r.l.number)}</b></td>
      <td><span class="badge ${r.l.type==="تحويل"?"b-tr":"b-new"}">${esc(r.l.type||"جديد")}</span></td>
      <td class="num">${fmtDate(r.l.startDate)}</td>
      <td class="n num">${money(r.inv)}</td>
      <td class="n num">${money(r.pay)}</td>
      <td class="n num" style="font-weight:700;color:${r.bal>0.009?"var(--red)":"var(--green)"}">${money(r.bal)}</td>
    </tr>`).join("")}
    </tbody></table></div>
    ${extras.length?`
    <div style="margin-top:6px" class="tbl-wrap"><table><thead><tr>
      <th colspan="3" style="background:var(--amber-soft);color:var(--amber)">الإضافات على الحساب</th>
    </tr><tr><th>سبب الإضافة</th><th>التاريخ</th><th class="n">المبلغ</th></tr></thead><tbody>
    ${extras.map(t=>`<tr>
      <td>${esc(t.reason||"إضافة")}</td>
      <td class="num">${fmtDate(t.date)}</td>
      <td class="n num" style="font-weight:700">${money(t.amount)}</td>
    </tr>`).join("")}
    </tbody></table></div>`:""}
    <div class="tot">
      <div><span>رصيد سابق</span><b class="num">${money(prev)}</b></div>
      <div><span>باقات ${monthLabel(mk)}</span><b class="num">${money(pkgDue)}</b></div>
      ${extraDue?`<div><span>إضافات ${monthLabel(mk)}</span><b class="num">${money(extraDue)}</b></div>`:""}
      <div><span>المدفوع خلال الشهر</span><b class="num" style="color:var(--green)">− ${money(monthPaid)}</b></div>
      <div class="big"><span>${totalBal>0.009?"المطلوب سداده":"الرصيد"}</span><b class="num" style="color:${totalBal>0.009?"var(--red)":"var(--green)"}">${money(Math.abs(totalBal))} ${cur}</b></div>
    </div>
    <div class="stamp">
      <div>السداد قبل يوم <span class="num">${day}</span> من كل شهر.<br>شكرًا لتعاملكم معنا.</div>
      <div style="text-align:end">التوقيع / الختم<br><br>ــــــــــــــــــ</div>
    </div>
  </div>`;
}

function openModal(html){ $("#modal").innerHTML = html; $("#overlay").classList.add("on"); }

  return `<div class="lrow" data-lrow="${l.id}">
    <div><label>رقم الخط ${i+1}</label><input type="text" class="f-num" value="${esc(l.number||"")}" placeholder="01xxxxxxxxx" inputmode="numeric"></div>
    <div><label>النوع</label><select class="f-type">
      <option ${l.type!=="تحويل"?"selected":""}>جديد</option><option ${l.type==="تحويل"?"selected":""}>تحويل</option></select></div>

function lineAddonRow(a){

/* نافذة مراجعة التجديد — تعرض الباقة + الإضافات + الحساب السابق + الإجمالي قبل الإنشاء */
function renewReviewModal(){
  const mk = UI.renewMonth, cur = esc(DB.settings.currency);
  const items = Object.keys(UI.renewSel).filter(id=>UI.renewSel[id])
    .map(id=>findLine(id)).filter(f=>f && !isExpired(f.l) && !hasChargeInPeriod(f.l.id,mk));
  if(!items.length){ toast("مفيش خطوط محددة قابلة للتجديد"); return; }

  let gPkg=0, gAdd=0, gPrev=0, gTot=0;
  const rows = items.map(({c,l})=>{
    const pkg=pkgPrice(l), add=addonsSum(l), prev=lineBalance(l.id), tot=prev+pkg+add;
    gPkg+=pkg; gAdd+=add; gPrev+=prev; gTot+=tot;
    return `<tr>
      <td><b>${esc(c.name)}</b><br><span class="tiny muted num">${esc(l.number||"—")}</span></td>
      <td class="n num">${money(pkg)}</td>
      <td class="n num">${money(add)}</td>
      <td class="n num" style="color:${prev>0.009?"var(--red)":"var(--ink-3)"}">${money(prev)}</td>
      <td class="n num" style="font-weight:800">${money(tot)}</td>
    </tr>`;
  }).join("");

  openModal(`
    <div class="modal-h"><h3>مراجعة تجديد ${monthLabel(mk)}</h3><button class="x" data-act="close">×</button></div>
    <div class="modal-b" style="padding:0">
      <div class="tbl-wrap"><table><thead><tr>
        <th>العميل / الخط</th><th class="n">الباقة</th><th class="n">الإضافات</th><th class="n">الحساب السابق</th><th class="n">الإجمالي</th>
      </tr></thead><tbody>${rows}</tbody>
      <tfoot><tr style="font-weight:800;background:var(--shell)">
        <td>الإجمالي (${items.length} خط)</td>
        <td class="n num">${money(gPkg)}</td><td class="n num">${money(gAdd)}</td>
        <td class="n num" style="color:var(--red)">${money(gPrev)}</td>
        <td class="n num" style="color:var(--red)">${money(gTot)}</td>
      </tr></tfoot></table></div>
      <div class="card-b tiny muted">سعر الباقة والإضافات هيتسجّلوا بقيمتهم دلوقتي وما بيتغيّروش بعد كده. الإجمالي بيشمل الحساب السابق المستحق.</div>
    </div>
    <div class="modal-f">
      <button class="btn primary" data-act="doRenew">تأكيد التجديد (<span class="num">${money(gTot)}</span> ${cur})</button>
      <button class="btn ghost" data-act="close">إلغاء</button>
    </div>`);
}

/* بعد إنشاء التجديد: نافذة تسجيل السداد — تخصم المدفوع وتُظهر المتبقّي */
function renewPayModal(cids){
  const cur = esc(DB.settings.currency);
  const custs = [...new Set(cids)].map(customerById).filter(Boolean);
  if(!custs.length){ closeModal(); render(); return; }
  const rows = custs.map(c=>{
    const due = Math.max(0, customerBalance(c.id));
    return `<div class="lrow" style="align-items:center">
      <div><b>${esc(c.name)}</b><br><span class="tiny muted">المطلوب: <b class="num">${money(due)}</b> ${cur}</span></div>
      <div><label>المدفوع الآن</label>
        <input type="number" class="rpay" data-cid="${c.id}" data-due="${due}" value="${due||""}" min="0" step="0.5" oninput="rpayLive(this)"></div>
      <div style="min-width:130px"><label>المتبقّي</label>
        <div class="rrem" data-cid="${c.id}" style="font-family:var(--display);font-weight:800;color:var(--green)">${money(0)} ${cur}</div></div>
    </div>`;
  }).join("");
  openModal(`
    <div class="modal-h"><h3>تسجيل السداد بعد التجديد</h3><button class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <p class="tiny muted" style="margin-top:0">اكتب المدفوع لكل عميل. لو دفع كامل يبقى الحساب «مسدد»، ولو جزء يظهر المتبقّي ويتسجّل في كشف الحساب. تقدر تسيبه صفر وتسجّل بعدين.</p>
      <div id="renewPayRows">${rows}</div>
    </div>
    <div class="modal-f">
      <button class="btn primary" data-act="doRenewPay">تسجيل السداد</button>
      <button class="btn ghost" data-act="close">تخطّي — أسجّل بعدين</button>
    </div>`);
  // حدّث المتبقّي المبدئي
  document.querySelectorAll(".rpay").forEach(rpayLive);
}
function rpayLive(el){
  const due = parseNum(el.dataset.due), paid = parseNum(el.value);
  const rem = Math.max(0, Math.round((due-paid)*100)/100);
  const box = document.querySelector(`.rrem[data-cid="${el.dataset.cid}"]`);
  if(box){
    box.textContent = money(rem) + " " + (DB.settings.currency||"");
    box.style.color = rem<=0.009 ? "var(--green)" : "var(--amber)";
  }
}

document.addEventListener("click", e=>{

  if(act==="doLogin"){ doLogin(); return; }

  if(act==="collapseAll"){ UI.open={}; render(); return; }
  if(act==="edit"){ customerModal(t.dataset.id); return; }

  if(act==="saveCust"){ saveCustomer(); return; }
  if(act==="del"){

    DB.customers = DB.customers.filter(x=>x.id!==c.id);
    DB.tx = DB.tx.filter(x=>x.customerId!==c.id);
    save(); render(); toast("تم الحذف");

  if(act==="doRenewPay"){ doRenewPay(); return; }

  if(act==="saveExtra"){ saveExtra(); return; }
  if(act==="extraVoid"){ const x=DB.tx.find(t2=>t2.id===t.dataset.tx); if(x){ x.status="ملغاة"; save(); render(); toast("اتلغت الإضافة"); } return; }
  if(act==="extraActivate"){ const x=DB.tx.find(t2=>t2.id===t.dataset.tx); if(x){ x.status="مستحقة"; save(); render(); toast("اتفعّلت الإضافة"); } return; }
  if(act==="extraDel"){ if(!confirm("حذف الإضافة دي نهائيًا؟")) return; DB.tx=DB.tx.filter(t2=>t2.id!==t.dataset.tx); save(); render(); toast("اتحذفت"); return; }
  if(act==="aoAdd"){
    const box=$("#aoRows"); const empty=$("#aoEmpty"); if(empty) empty.remove();
    box.insertAdjacentHTML("beforeend", addonRow(null)); return;
  }
  if(act==="aoRm"){ t.closest(".ao-row").remove(); return; }
  if(act==="aoSave"){ saveAddons(); return; }
  if(act==="ledger"){ ledgerModal(t.dataset.line); return; }
  if(act==="detail"){ detailModal(t.dataset.id); return; }
  if(act==="delTx"){

    DB.tx = DB.tx.filter(x=>x.id!==t.dataset.tx);
    save(); closeModal(); render(); toast("اتحذفت");

  if(act==="printInvoice"){ printHtml($("#invBox")?$("#invBox").outerHTML:""); return; }

    downloadFile(`فاتورة-${(c?c.name:"عميل").replace(/\s+/g,"_")}-${UI.invMonth}.html`, standaloneDoc($("#invBox").outerHTML), "text/html");

  if(act==="csvReport"){ exportReportCsv(); return; }
  if(act==="lineLookup"){ UI.lineQ=$("#lineQ").value; $("#lineResult").innerHTML=lineLookupHtml(UI.lineQ); return; }
  if(act==="doImport"){ doImport(); return; }

      "أحمد محمد,01001234567,جديد,08/01/2026,250","أحمد محمد,01007654321,تحويل,08/01/2026,180","منى علي,01112223334,جديد,15/02/2026,300"].join("\n"),"text/csv");
    return;
  }
  if(act==="backup"){ downloadFile(`نسخة-حساب-فودافون-${todayISO()}.json`, JSON.stringify(DB,null,2), "application/json"); return; }
  if(act==="restore"){ restore(); return; }
  if(act==="csvCustomers"){ exportCustomersCsv(); return; }
  if(act==="csvTx"){ exportTxCsv(); return; }
  if(act==="saveSettings"){
    DB.settings.shopName=$("#setShop").value.trim()||"حساب فودافون";
    DB.settings.currency=$("#setCur").value.trim()||"ج.م";
    DB.settings.reportDay=Math.min(28,Math.max(1,parseNum($("#setDay").value)||8));
    DB.settings.generateOnDueDate = $("#setGen").value==="1";

    save(); render(); toast("اتحفظت الإعدادات");

  }
  if(act==="wipe"){
    if(!confirm("مسح كل البيانات نهائيًا؟")) return;
    if(!confirm("متأكد؟ خُد نسخة احتياطية الأول.")) return;
    DB.customers=[]; DB.tx=[]; save(); render(); toast("تم المسح");
    return;
  }
});

/* ---------- actions ---------- */
function saveCustomer(){
  const id = $("#cid").value;
  const name = $("#cname").value.trim();
  if(!name){ toast("اكتب اسم العميل"); $("#cname").focus(); return; }
  const rows = [...document.querySelectorAll(".lrow")].map(r=>({
    id: r.dataset.lrow,
    number: digits(r.querySelector(".f-num").value.trim()),
    type: r.querySelector(".f-type").value,
    startDate: r.querySelector(".f-date").value || todayISO(),
    monthly: parseNum(r.querySelector(".f-amt").value),
    addons: [...r.querySelectorAll(".lao-row")].map(a=>({
      name: a.querySelector(".lao-name").value.trim(),
      amount: parseNum(a.querySelector(".lao-amt").value)
    })).filter(a=>a.name || a.amount)
  })).filter(r=>r.number || r.monthly);
  if(!rows.length){ toast("أضف خط واحد على الأقل برقمه وقيمة فاتورته"); return; }
  if(rows.length>5){ toast("الحد الأقصى ٥ خطوط"); return; }

  if(id){
    const c = customerById(id);
    c.name=name; c.note=$("#cnote").value.trim();
    const keep = new Set(rows.map(r=>r.id));
    c.lines.filter(l=>!keep.has(l.id)).forEach(l=>{ DB.tx = DB.tx.filter(t=>t.lineId!==l.id); });
    c.lines = rows.map(r=>{ const old=c.lines.find(l=>l.id===r.id); return Object.assign({},old||{},r); });
  }else{
    DB.customers.push({ id:uid(), name, note:$("#cnote").value.trim(), lines:rows, created:todayISO() });
  }
  const n = ensureInvoices();
  save(); closeModal(); render();
  toast(id ? "اتحفظ التعديل" : `اتضاف العميل${n?` وتولّدت ${n} فاتورة`:""}`);
}
function doPay(){
  const cid=$("#pcid").value, lid=$("#plid").value;
  const amt=parseNum($("#pamt").value), date=$("#pdate").value||todayISO(), note=$("#pnote").value.trim();
  if(amt<=0){ toast("اكتب مبلغ صحيح"); return; }
  if(lid){
    DB.tx.push({id:uid(),kind:"payment",customerId:cid,lineId:lid,amount:amt,date,period:String(date).slice(0,7),note:note||"دفعة"});
    save();
  }else{
    payCustomer(cid, amt, date, note);
  }
  closeModal(); render(); toast(`اتسجل دفع ${money(amt)} ${DB.settings.currency}`);
}
/* إنشاء التجديدات للخطوط المحددة ثم فتح نافذة السداد */
function doRenew(){
  const mk = UI.renewMonth;
  const ids = Object.keys(UI.renewSel).filter(id=>UI.renewSel[id]);
  const cids = [];
  let done=0;
  ids.forEach(id=>{
    const tx = renewLine(id, mk);
    if(tx){ done++; cids.push(tx.customerId); }
  });
  if(!done){ toast("مفيش تجديدات اتعملت (يمكن كانت متجددة بالفعل)"); return; }
  save();
  UI.renewSel = {};
  toast(`تم تجديد ${done} خط لشهر ${monthLabel(mk)}`);
  renewPayModal(cids);   // الانتقال لتسجيل السداد
  render();
}
/* تسجيل الدفعات المُدخلة في نافذة ما بعد التجديد */
function doRenewPay(){
  const inputs = [...document.querySelectorAll(".rpay")];
  let total=0, count=0;
  inputs.forEach(inp=>{
    const cid=inp.dataset.cid, amt=parseNum(inp.value);
    if(amt>0.009){ payCustomer(cid, amt, todayISO(), "سداد بعد التجديد"); total+=amt; count++; }
  });
  save(); closeModal(); render();
  toast(count?`اتسجل سداد ${money(total)} ${DB.settings.currency} لـ ${count} عميل`:"تم — من غير سداد دلوقتي");
}
/* حفظ إضافات خط من النافذة السريعة */
function saveAddons(){
  const lineId=$("#aoLine").value; const f=findLine(lineId); if(!f) return;
  const rows=[...document.querySelectorAll(".ao-row")].map(r=>({
    name:r.querySelector(".ao-name").value.trim(),
    amount:parseNum(r.querySelector(".ao-amt").value)
  })).filter(a=>a.name || a.amount);
  f.l.addons = rows;
  save(); closeModal(); render(); toast("اتحفظت الإضافات");
}
function doImport(){
  const raw = $("#imp").value.trim();
  if(!raw){ toast("الصق البيانات الأول"); return; }
  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  let added=0, newCust=0, skipped=0;
  lines.forEach((ln,idx)=>{
    const sep = ln.includes("\t") ? "\t" : (ln.split(",").length>=3 ? "," : ";");
    const p = ln.split(sep).map(s=>s.trim().replace(/^"|"$/g,""));
    if(idx===0 && /اسم|name/i.test(p[0]||"")) return;
    const [name,num,type,date,amt] = p;
    if(!name || !num){ skipped++; return; }
    let c = DB.customers.find(x=>x.name.trim()===name.trim());
    if(!c){ c={id:uid(),name:name.trim(),note:"",lines:[],created:todayISO()}; DB.customers.push(c); newCust++; }
    if(c.lines.length>=5){ skipped++; return; }
    const numClean = digits(num).replace(/\s/g,"");
    if(c.lines.some(l=>l.number===numClean)){ skipped++; return; }
    c.lines.push({ id:uid(), number:numClean,
      type: /تحويل|transfer/i.test(type||"") ? "تحويل":"جديد",
      startDate: parseDateLoose(date) || todayISO(),
      monthly: parseNum(amt) });
    added++;
  });
  const inv = ensureInvoices();
  save(); UI.tab="customers"; render();
  toast(`تم: ${newCust} عميل جديد · ${added} خط · ${inv} فاتورة${skipped?` · ${skipped} سطر متخطّى`:""}`);
}
function restore(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d.customers) throw new Error("bad");
        DB.customers=d.customers; DB.tx=d.tx||[]; DB.settings=Object.assign(DB.settings,d.settings||{});
        ensureInvoices(); save(); render(); toast("اتسترجعت النسخة");
      }catch(err){ toast("الملف مش صالح"); } };
    r.readAsText(f,"utf-8"); };
  inp.click();
}

/* ---------- export / print ---------- */
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  toast("اتنزّل الملف");
}
function csv(rows){ return "\uFEFF"+rows.map(r=>r.map(c=>{ const s=String(c??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); }
function exportCustomersCsv(){
  const rows=[["اسم العميل","رقم الخط","نوع الخط","تاريخ الانتهاء","سعر الباقة","رصيد الخط","إجمالي مديونية العميل"]];
  DB.customers.forEach(c=>c.lines.forEach(l=>rows.push([c.name,l.number,l.type,fmtDate(l.startDate),l.monthly,lineBalance(l.id),customerBalance(c.id)])));
  downloadFile(`العملاء-والخطوط-${todayISO()}.csv`, csv(rows), "text/csv");
}
function exportTxCsv(){
  const rows=[["التاريخ","العميل","رقم الخط","النوع","المبلغ","الشهر","ملاحظة"]];
  DB.tx.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{
    const c=customerById(t.customerId), f=findLine(t.lineId);
    rows.push([fmtDate(t.date), c?c.name:"", f?f.l.number:"", t.kind==="payment"?"دفعة":"فاتورة", t.amount, t.period||"", t.note||""]);
  });
  downloadFile(`الحركات-${todayISO()}.csv`, csv(rows), "text/csv");
}
function exportReportCsv(){
  const mk=UI.reportMonth;
  const rows=[[`تقرير ${monthLabel(mk)}`],["العميل","الأرقام","مستحق الشهر","دفع","متبقي","إجمالي المديونية","الحالة"]];
  DB.customers.forEach(c=>{
    const d=dueInPeriod(c.id,mk), p=paidInPeriod(c.id,mk), b=customerBalance(c.id), st=statusOf(d,p);
    if(d<=0 && p<=0 && b<=0.009) return;
    const late = st.k!=="paid" && d>0 && isLateNow(mk);
    rows.push([c.name, c.lines.map(l=>l.number).join(" | "), d, p, Math.max(0,d-p), b, late?"متأخر — "+st.txt:st.txt]);
  });
  downloadFile(`تقرير-${mk}.csv`, csv(rows), "text/csv");
}
function standaloneDoc(inner){
  const css = [...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة</title><style>${css}</style></head><body style="background:#fff;padding:20px">${inner}</body></html>`;
}

  const p=$("#printArea"); p.innerHTML=inner; p.style.display="block";
  const view=$("#view"); view.style.display="none";
  window.print();
  setTimeout(()=>{ p.style.display="none"; p.innerHTML=""; view.style.display=""; },600);

function doLogin(){
  const email=($("#lgEmail").value||"").trim(), pass=$("#lgPass").value||"";
  if(!email||!pass){ showLogin("اكتب البريد وكلمة المرور"); return; }
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .catch(err=>showLogin("فشل الدخول: "+(err&&err.code||"")));
}
function doLogout(){ if(window.firebase&&firebase.auth) firebase.auth().signOut(); }

/* ---------- boot ---------- */
function afterFirstLoad(){
  const n = ensureInvoices();
  render();
  if(CLOUD) setStatus("cloud"); else setStatus("local");
  if(n) toast(`اتضافت ${n} فاتورة شهرية تلقائيًا`);
}
(async function(){
  await load();
  if(CLOUD){
    if(USE_LOGIN){
      firebase.auth().onAuthStateChanged(user=>{
        if(user){ if(!cloudReady) bindCloud(afterFirstLoad); else render(); }
        else { cloudReady=false; if(dbref){ dbref.off(); dbref=null; } showLogin(); }
      });
    }else{
      bindCloud(afterFirstLoad);
    }
  }else{
    afterFirstLoad(); // وضع التخزين المحلي
  }
})();
</script>
</body>
</html>
